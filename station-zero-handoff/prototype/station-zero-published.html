<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Station Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#060918; --panel:rgba(10,14,36,.86); --edge:#26306a; --ink:#dfe6ff; --dim:#8a96c8;
  --amber:#ffb347; --cyan:#4ff0ff; --rose:#ff4f7b; --lime:#8dff6a; --violet:#a98bff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --void:#060918; --panel:rgba(10,14,36,.86); --ink:#dfe6ff; --dim:#8a96c8; }
}
:root[data-theme="dark"]{ --void:#060918; --panel:rgba(10,14,36,.86); --ink:#dfe6ff; --dim:#8a96c8; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; overflow:hidden; background:var(--void); color:var(--ink);
  font-family:"Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif; }
#app{ position:relative; height:100%; width:100%; }
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
canvas:active{ cursor:grabbing; }

.hud{ position:absolute; top:12px; left:12px; right:12px; display:flex; gap:12px; justify-content:space-between; align-items:flex-start; pointer-events:none; }
.brand h1{ margin:0; font-family:"Pixelify Sans", ui-monospace, monospace; font-weight:600; font-size:clamp(22px,4vw,30px); line-height:1; color:#ffd9b0; text-shadow:0 2px 0 rgba(60,20,8,.8), 0 0 14px rgba(255,170,110,.35); }
.art-toggle{ pointer-events:auto; margin-top:6px; font:inherit; font-size:12px; color:#f3e2d2; background:rgba(10,14,36,.7); border:1px solid #3a4580; border-radius:5px; padding:3px 8px; cursor:pointer; }
.art-toggle:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
.brand p{ margin:4px 0 0; font-size:13px; color:#f3e2d2; text-shadow:0 1px 2px rgba(30,10,4,.9); }
.stats{ display:flex; gap:14px; margin:0; padding:8px 12px; background:var(--panel); border:1px solid var(--edge); border-radius:6px; }
.stats div{ display:flex; flex-direction:column; }
.stats dt{ font-size:11px; color:var(--dim); }
.stats dd{ margin:0; font-family:"Pixelify Sans", ui-monospace, monospace; font-size:18px; display:flex; align-items:center; gap:6px; }
.bar{ width:64px; height:6px; background:#1a2150; border-radius:3px; overflow:hidden; display:inline-block; }
.bar i.dome{ background:linear-gradient(90deg,#9ad8ff,#ffd59a); }
.bar i{ display:block; height:100%; width:50%; background:linear-gradient(90deg,var(--amber),#ffe066); transition:width .3s; }

.log{ position:absolute; left:12px; bottom:116px; margin:0; padding:0; list-style:none; max-width:min(420px,calc(100% - 24px)); pointer-events:none; }
.log li{ font-size:13px; line-height:1.35; padding:3px 8px; margin-top:3px; background:rgba(6,9,24,.72); border-left:2px solid var(--c,#4ff0ff); border-radius:0 4px 4px 0; transition:opacity .4s; }

.tools{ position:absolute; left:50%; transform:translateX(-50%); bottom:12px; display:grid; grid-template-columns:repeat(7,auto); gap:6px; padding:6px; background:var(--panel); border:1px solid var(--edge); border-radius:10px; max-width:calc(100% - 24px); }
.tools button{ font:inherit; font-size:13px; font-weight:500; color:var(--ink); background:#121a44; border:1px solid #2c3878; border-radius:6px; padding:9px 12px; cursor:pointer; white-space:nowrap; }
.tools button:hover{ background:#1a2560; }
.tools button:focus-visible, .inspect button:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
.tools .surge{ border-color:#7a5320; color:#ffd08a; }
.tools .spawn{ border-color:#1f6a78; color:#9ff7ff; }
.tools .build{ border-color:#7a2440; color:#ffa0b8; }
.tools .sign{ border-color:#6f6420; color:#fff0a0; }
.tools button:disabled{ opacity:.45; cursor:default; }

.inspect{ position:absolute; right:12px; top:84px; width:300px; max-height:calc(100% - 210px); overflow:auto; background:var(--panel); border:1px solid var(--edge); border-top:3px solid var(--k,#4ff0ff); border-radius:8px; padding:12px 14px; }
.inspect header{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
.inspect h2{ margin:0; font-family:"Pixelify Sans", ui-monospace, monospace; font-size:20px; color:var(--k,#4ff0ff); }
.inspect .close{ font:inherit; background:none; border:1px solid var(--edge); color:var(--dim); border-radius:4px; cursor:pointer; padding:2px 8px; }
.inspect .desc{ font-size:13px; color:var(--dim); margin:6px 0 10px; }
.inspect ul{ list-style:none; margin:0; padding:0; }
.inspect li{ padding:7px 0; border-top:1px solid #1d2556; font-size:13px; }
.inspect li b{ font-weight:600; color:var(--ink); }
.inspect li span{ color:var(--dim); }
.inspect li em{ display:block; font-style:normal; color:#b8c3f0; margin-top:2px; }
.inspect .empty{ font-size:13px; color:var(--dim); }

@media (max-width:720px){
  .hud{ flex-direction:column; gap:8px; }
  .stats{ gap:10px; padding:6px 10px; }
  .tools{ grid-template-columns:repeat(4,1fr); width:calc(100% - 24px); }
  .tools button{ padding:9px 6px; font-size:12px; }
  .log{ bottom:132px; }
  .log li:nth-child(-n+2){ display:none; }
  .inspect{ left:12px; right:12px; width:auto; top:auto; bottom:132px; max-height:38%; }
}
@media (prefers-reduced-motion: reduce){ .bar i{ transition:none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="Live view of the colony at Jezero Crater. Drag to pan, scroll or pinch to zoom in until roofs open, tap a building to inspect it."></canvas>

  <header class="hud">
    <div class="brand"><h1>Station Zero</h1><p id="cycle">Jezero Crater, year 1, sol 1</p><button id="bArt" class="art-toggle">Art: 2D</button></div>
    <dl class="stats">
      <div><dt>Beings</dt><dd id="sBeings">0</dd></div>
      <div><dt>Modules</dt><dd id="sMods">0</dd></div>
      <div><dt>Ice</dt><dd id="sIce">0</dd></div>
      <div><dt>Regolith</dt><dd id="sReg">0</dd></div>
      <div title="People, ice and regolith needed for the first dome"><dt>First dome</dt><dd><span class="bar"><i id="sDome" class="dome"></i></span></dd></div>
      <div><dt>Energy</dt><dd><span class="bar"><i id="sBar"></i></span><span id="sEnergy">0</span></dd></div>
    </dl>
  </header>

  <ol class="log" id="log" aria-live="polite"></ol>

  <aside class="inspect" id="inspect" hidden>
    <header><h2 id="iName">Module</h2><button class="close" id="iClose" aria-label="Close">Close</button></header>
    <p class="desc" id="iDesc"></p>
    <ul id="iList"></ul>
  </aside>

  <nav class="tools" aria-label="Your influence">
    <button class="surge" id="bFortune" title="Reactors run hot for one sol">Good fortune</button>
    <button class="build" id="bInspire" title="Tap a module, then plant the dream of building another like it">Inspire</button>
    <button class="spawn" id="bGrace" title="Tap a habitat, then make births more likely there">Grace</button>
    <button class="sign" id="bSign" title="A light crosses the sky. Each being reacts in its own way">Send a sign</button>
    <button id="bPause">Pause</button>
    <button id="bSpeed">Speed 1×</button>
    <button id="bFit">Fit view</button>
  </nav>
</div>

<script>
(() => {
const T = 8;
const KINDS = {
  core:     { label:'Reactor',  color:'#ffb347', floor:'#22160b', desc:'A compact fission reactor. Generates the energy every being runs on.' },
  habitat:  { label:'Habitat',  color:'#4ff0ff', floor:'#0a1f2c', desc:'Where beings rest, meet, and where new ones are born.' },
  workshop: { label:'Workshop', color:'#ff4f7b', floor:'#240b16', desc:'Builders here decide what the station needs next, then build it.' },
  archive:  { label:'Archive',  color:'#a98bff', floor:'#171032', desc:'Keeps the station\u2019s memory of everything that happened.' },
  garden:   { label:'Greenhouse', color:'#8dff6a', floor:'#0e220e', desc:'Grows food under glass, a little extra energy, and a lot of calm.' },
  comms:    { label:'Comms',    color:'#ffe066', floor:'#22200b', desc:'Listens outward. The busiest corridors start here.' }
};
const TRAITS = {
  builder: { likes:'workshop', color:'#ff7a9a' },
  curious: { likes:'archive',  color:'#c3b0ff' },
  social:  { likes:'habitat',  color:'#7ff7ff' },
  tender:  { likes:'garden',   color:'#a8ff8c' }
};
/* ---------- Mars calendar & sky (hidden birth-chart engine) ---------- */
// Time unit is the Earth hour. 1 real second at 1x speed = 1 hour.
const SOL_H = 24.6597, YEAR_H = 686.98*24, EARTH_YEAR_H = 365.256*24;
const PHOBOS_H = 7.6538, DEIMOS_H = 30.312, LUNA_H = 27.3217*24;
const ECC = 0.0934, M0 = 99;                   // Mars orbital eccentricity; epoch puts founding at the northern spring equinox
const SITE = { name:'Jezero Crater', lon:77.5 };
const START_HOUR = SOL_H*0.25;                 // colonists land at dawn, year 1 sol 1
const SIGNS = [
  { name:'The Spark',        el:'fire',  mod:'cardinal' },
  { name:'The Monolith',     el:'earth', mod:'fixed'    },
  { name:'The Twin Signal',  el:'air',   mod:'mutable'  },
  { name:'The Tide Shell',   el:'water', mod:'cardinal' },
  { name:'The Crown Star',   el:'fire',  mod:'fixed'    },
  { name:'The Lattice',      el:'earth', mod:'mutable'  },
  { name:'The Balance Arc',  el:'air',   mod:'cardinal' },
  { name:'The Deep Lantern', el:'water', mod:'fixed'    },
  { name:'The Far Arrow',    el:'fire',  mod:'mutable'  },
  { name:'The Summit',       el:'earth', mod:'cardinal' },
  { name:'The Relay',        el:'air',   mod:'fixed'    },
  { name:'The Drift',        el:'water', mod:'mutable'  }
];
const ELEMENT = {
  fire:  { drive:1,   restless:.6 },
  earth: { steady:1,  care:.4, drive:.3 },
  air:   { curiosity:1, sociability:.6, restless:.3 },
  water: { care:1,    sociability:.7, steady:.2 }
};
const MODALITY = {
  cardinal: { drive:.4, restless:.2 },
  fixed:    { steady:.6, restless:-.4 },
  mutable:  { restless:.5, curiosity:.3, steady:-.3 }
};
const DIMS = ['drive','curiosity','sociability','care','restless','steady'];
const ADJ = { drive:'driven', curiosity:'inquisitive', sociability:'warm', care:'nurturing', restless:'restless', steady:'steady' };
const ROLE_OF = { drive:'builder', curiosity:'curious', sociability:'social', care:'tender' };

const D2R = Math.PI/180;
const mod360 = v => ((v%360)+360)%360;
const sign = lon => Math.floor(mod360(lon)/30);
// Solar longitude Ls: Mars-tropical zodiac, so the sun sign IS the Martian season. Eccentric orbit = uneven signs.
function marsLs(t){
  const M = (M0 + 360*t/YEAR_H)*D2R;
  const nu = M + 2*ECC*Math.sin(M) + 1.25*ECC*ECC*Math.sin(2*M);
  return mod360(nu/D2R + 251);
}
function marsHour(t){ return (((t/SOL_H)%1)+1)%1*24; }
function earthSeenFromMars(t){
  const lm = (marsLs(t)-180)*D2R, le = (40 + 360*t/EARTH_YEAR_H)*D2R;
  return mod360(Math.atan2(Math.sin(le)-1.524*Math.sin(lm), Math.cos(le)-1.524*Math.cos(lm))/D2R);
}
function marsChart(t, lon){
  const Ls = marsLs(t);
  return { world:'mars',
    sun:    sign(Ls),
    deimos: sign(360*t/DEIMOS_H + 211),
    phobos: sign(360*t/PHOBOS_H + 53),
    rise:   sign(Ls + (marsHour(t)-6)/24*360 + lon),   // at dawn, rising = sun sign
    earth:  sign(earthSeenFromMars(t)) };
}
function earthChart(t, lon){
  const sun = 360*t/EARTH_YEAR_H + 15, hour = ((t%24)+24)%24;
  return { world:'earth', sun:sign(sun), moon:sign(360*t/LUNA_H + 137), rise:sign(sun + (hour-6)/24*360 + lon) };
}
// [sign, weight, inner boost (care/warmth), outer boost (restless/steady), drive boost, curiosity boost]
function placements(c){
  return c.world==='mars'
    ? [ [c.sun,.35,1,1,1,1], [c.deimos,.2,1.5,.8,1,1], [c.phobos,.15,.8,1.4,1.4,1], [c.rise,.2,.8,1.6,1,1], [c.earth,.1,1,1,1,1.8] ]
    : [ [c.sun,.5,1,1,1,1], [c.moon,.3,1.4,.8,1,1], [c.rise,.2,.8,1.6,1,1] ];
}
function personaFrom(chart){
  const p = Object.fromEntries(DIMS.map(d=>[d,0]));
  placements(chart).forEach(([idx,w,inner,outer,drv,cur])=>{
    const sg = SIGNS[idx], e = ELEMENT[sg.el], m = MODALITY[sg.mod];
    DIMS.forEach(d=>{
      let v = (e[d]||0) + (m[d]||0)*0.6;
      if(d==='care'||d==='sociability') v *= inner;
      if(d==='restless'||d==='steady') v *= outer;
      if(d==='drive') v *= drv;
      if(d==='curiosity') v *= cur;
      p[d] += w*v;
    });
  });
  DIMS.forEach(d=>{ p[d] = clamp((p[d]+0.3)/1.5, 0, 1); });
  return p;
}
const ROLE_W = { drive:.88, curiosity:1, sociability:1.16, care:.97 };   // balances temperaments across a full year
function roleOf(p){ return Object.keys(ROLE_OF).reduce((b,d)=>p[d]*ROLE_W[d]>p[b]*ROLE_W[b]?d:b,'drive'); }
function describe(p){
  const top = [...DIMS].sort((a,b)=>p[b]-p[a]);
  const first = top[0], second = top.find(d=>d!==first && !((first==='restless'&&d==='steady')||(first==='steady'&&d==='restless')));
  return `${ADJ[first]} and ${ADJ[second]}`;
}
function lonOf(m){ return SITE.lon + (m.tx + m.tw/2) * 0.25; }   // game-scale birthplace: where in the colony you're born shifts your rising sign
function season(t){ const Ls = marsLs(t); return ['northern spring','northern summer','northern autumn','northern winter'][Math.floor(Ls/90)]; }

const THOUGHTS = {
  core:     ['Tuning the reactor hum','Watching the energy curve','Venting heat into the corridors','Counting how many of us the core can feed'],
  habitat:  ['Resting between shifts','Swapping stories with neighbors','Showing a newcomer the corridors','Wondering what lies past the dark'],
  workshop: ['Sketching plans for a new wing','Welding corridor plates','Arguing about where to build next','Testing a new kind of console'],
  archive:  ['Writing down what happened today','Rereading the founding logs','Choosing names for the newborns','Cross-checking rumors against records'],
  garden:   ['Coaxing light into the algae beds','Harvesting nutrient paste','Listening to things grow','Pruning the glow vines'],
  comms:    ['Scanning the dark for signals','Broadcasting the station\u2019s name','Relaying chatter between modules','Hearing something faint, maybe nothing']
};
const TALK = {
  core:     ['Hear that hum?','Core temp looks good.','Who left the coolant log open?'],
  habitat:  ['Sleep well?','The kids are loud today.','Want to eat together later?','This wall still creaks.'],
  workshop: ['Pass the torque wrench.','That weld will hold.','We need more plates.'],
  archive:  ['I wrote that down.','Look at the founding logs.','Who named the newborns?'],
  garden:   ['The beans are coming in.','Smell that? Soil.','Light levels are perfect.'],
  comms:    ['Earth is a bright dot tonight.','Nothing on the band but static.','Phobos is up again.']
};
const REPLY = ['Ha. True.','Tell me more.','Hmm, maybe.','I was thinking that too.','No way.','Right?','Later, I promise.'];
let lastSignAt = -999, talkTimer = 0;
function talkLine(a, b){
  const P = a.persona, pool = [...TALK[a.mod.kind]];
  if(construction) pool.push(`They're building ${construction.m.name}.`, 'They need hands out there.');
  if(simTime-lastSignAt < SOL_H) pool.push('Did you see that light?','That light meant something.','Lights in the sky again...');
  if(simTime < fortuneUntil) pool.push('The reactor is generous today.');
  if(P.curiosity>.6) pool.push('What is past the crater rim?','I want to walk the old delta.');
  if(P.care>.6) pool.push('You look tired.','Did you eat?');
  if(P.restless>.6) pool.push('I need to get outside.','Let us go see the delta.');
  if(P.steady>.6) pool.push('Same as yesterday. Good.');
  if(a.earthBorn) pool.push('I miss rain.','On Earth the sky was blue.');
  return pick(pool);
}
const SYL_A = ['Ki','Vo','Ra','Ze','Lu','Ny','Ta','Or','Ix','Me','Sa','Du','Quo','El','Fen'];
const SYL_B = ['ro','x','na','le','th','ka','vi','mo','sk','ra','ne','dra'];

const R = (a,b) => a + Math.random()*(b-a);
const RI = (a,b) => Math.floor(R(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

let modules=[], corridors=[], agents=[], packets=[];
let nextId=1, energy=90, simTime=START_HOUR, speed=1, paused=false, selected=null, construction=null;
let spawnAcc=0, birthTimer=0, buildTimer=0, starveTimer=0;
let fortuneUntil = -1, inspiration = null, meteor = null;
const graceFor = new Map();
const cooldown = { fortune:0, inspire:0, grace:0, sign:0 };
let ice = 60, regolith = 80, domeReady = false, regolithWarnAt = -999, thirstWarnAt = -999;
const DOME_GOAL = { pop:20, ice:250, regolith:500 };
const sites = [];
const kindCount = { core:0, habitat:0, workshop:0, archive:0, garden:0, comms:0 };

/* ---------- world building ---------- */
function makeModule(kind, tx, ty, tw, th, built=1){
  kindCount[kind]++;
  const m = { id:nextId++, kind, tx, ty, tw, th, built, pulse:0, name:KINDS[kind].label+' '+kindCount[kind], items:[] };
  const k = KINDS[kind];
  const n = Math.floor(tw*th/7);
  for(let i=0;i<n;i++){
    const w = Math.random()<.5 ? 2 : 1;
    const x = RI(tx+1, tx+tw-1-w), y = RI(ty+2, ty+th-2);
    m.items.push({ x:x*T+1, y:y*T+1, w:w*T-2, h:T-2,
      light: Math.random()<.7 ? k.color : pick(['#ffffff','#ff4f7b','#4ff0ff']),
      ph:R(0,6.28), sp:R(1,4) });
  }
  modules.push(m);
  return m;
}
function inner(m){ return { x0:(m.tx+1)*T, y0:(m.ty+2)*T, x1:(m.tx+m.tw-1)*T, y1:(m.ty+m.th-1)*T }; }
function randomPoint(m){ const b=inner(m); return { x:R(b.x0+2,b.x1-2), y:R(b.y0+2,b.y1-2) }; }
function clampIn(m,p){ const b=inner(m); return { x:clamp(p.x,b.x0+2,b.x1-2), y:clamp(p.y,b.y0+2,b.y1-2) }; }
function overlap(a,b,mg){ return a.tx < b.tx+b.tw+mg && a.tx+a.tw+mg > b.tx && a.ty < b.ty+b.th+mg && a.ty+a.th+mg > b.ty; }

function findSpot(){
  const built = modules.filter(m=>m.built>=1);
  for(let tries=0; tries<80; tries++){
    const p = pick(built), dir = pick(['r','l','u','d']);
    const tw=RI(10,14), th=RI(8,10), gap=RI(5,9);
    const cy=Math.floor(p.ty+p.th/2), cx=Math.floor(p.tx+p.tw/2);
    let tx,ty,gr;
    if(dir==='r'){ tx=p.tx+p.tw+gap; ty=cy-Math.floor(th/2); gr={tx:p.tx+p.tw, ty:cy-1, tw:gap, th:3}; }
    if(dir==='l'){ tx=p.tx-gap-tw;   ty=cy-Math.floor(th/2); gr={tx:tx+tw, ty:cy-1, tw:gap, th:3}; }
    if(dir==='d'){ ty=p.ty+p.th+gap; tx=cx-Math.floor(tw/2); gr={tx:cx-1, ty:p.ty+p.th, tw:3, th:gap}; }
    if(dir==='u'){ ty=p.ty-gap-th;   tx=cx-Math.floor(tw/2); gr={tx:cx-1, ty:ty+th, tw:3, th:gap}; }
    const rect={tx,ty,tw,th};
    if(modules.some(m=>overlap(rect,m,2))) continue;
    if(modules.some(m=>m!==p && overlap(gr,m,1))) continue;
    if(corridors.some(c=>overlap(rect,c.rect,1) || overlap(gr,c.rect,1))) continue;
    return { p, dir, tx, ty, tw, th, gr, cx, cy };
  }
  return null;
}
function makeCorridor(p, n, s, built){
  let p1,p2;
  if(s.dir==='r'||s.dir==='l'){
    const y = s.cy*T + T/2;
    p1 = { x:(s.dir==='r' ? p.tx+p.tw : p.tx)*T, y };
    p2 = { x:(s.dir==='r' ? n.tx : n.tx+n.tw)*T, y };
  } else {
    const x = s.cx*T + T/2;
    p1 = { x, y:(s.dir==='d' ? p.ty+p.th : p.ty)*T };
    p2 = { x, y:(s.dir==='d' ? n.ty : n.ty+n.th)*T };
  }
  const c = { a:p, b:n, p1, p2, rect:s.gr, built, len:Math.hypot(p2.x-p1.x,p2.y-p1.y) };
  corridors.push(c);
  return c;
}
function other(c,m){ return c.a===m ? c.b : c.a; }
function neighbors(m){ return corridors.filter(c=>c.built>=1 && (c.a===m || c.b===m)); }
function count(kind){ return modules.filter(m=>m.kind===kind && m.built>=1).length; }

function chooseKind(){
  if(inspiration && simTime<inspiration.until && Math.random()<.75) return inspiration.kind;
  const pop = agents.length, hab = count('habitat');
  if(pop + 2 > hab*6) return 'habitat';
  if(production() - consumption() < 0.6) return Math.random()<.65 ? 'core' : 'garden';
  const opts = ['archive','comms','garden','habitat','core'];
  if(count('workshop') < 3) opts.push('workshop');
  return pick(opts);
}
function startConstruction(kind, byCreator){
  if(construction) return false;
  const s = findSpot();
  if(!s) return false;
  const n = makeModule(kind, s.tx, s.ty, s.tw, s.th, 0);
  const c = makeCorridor(s.p, n, s, 0);
  construction = { m:n, c, p:s.p, lastWork:simTime };
  const inspired = inspiration && simTime<inspiration.until && inspiration.kind===kind;
  addLog(inspired ? `Builders acted on the dream from ${inspiration.from} and broke ground on ${n.name}` :
                    `Builders broke ground on ${n.name}, off ${s.p.name}`, KINDS[kind].color);
  if(inspired) inspiration = null;
  if(!userMoved) fitView();
  return true;
}

/* ---------- beings ---------- */
function makeName(){ return pick(SYL_A)+pick(SYL_B)+'-'+RI(1,99); }
function makeAgent(m, opts={}){
  const p = randomPoint(m);
  let bornAt = opts.bornAt ?? simTime, chart, persona;
  const earthLon = R(-120,140);   // founders were born somewhere on Earth
  for(let i=0;i<300;i++){
    chart = opts.founder ? earthChart(bornAt, earthLon) : marsChart(bornAt, lonOf(m));
    persona = personaFrom(chart);
    if(!opts.wantRole || ROLE_OF[roleOf(persona)]===opts.wantRole) break;
    bornAt = opts.bornAt - R(0, EARTH_YEAR_H*15);   // founders: search their pre-launch birth dates
  }
  const a = { id:nextId++, name:makeName(), chart, persona, trait:ROLE_OF[roleOf(persona)], mod:m,
    x:p.x, y:p.y, tx:p.x, ty:p.y, state:'walk', wait:R(0,2), thought:'', cor:null, t:0, fromA:true, face:1, born:bornAt, earthBorn:!!opts.founder };
  dressBeing(a);
  setTarget(a); setThought(a);
  agents.push(a);
  return a;
}
function setTarget(a){ const p=randomPoint(a.mod); a.tx=p.x; a.ty=p.y; }
function isInside(a){ return a.state!=='transit' && a.state!=='eva' && a.state!=='work' && a.state!=='mining'; }
function isOutside(a){ return a.state==='eva' || a.state==='work' || a.state==='mining'; }

/* ---------- resources: ice fields and regolith pits ---------- */
function colonyRadius(){
  return modules.reduce((mx,m)=>Math.max(mx, ...[[m.tx,m.ty],[m.tx+m.tw,m.ty],[m.tx,m.ty+m.th],[m.tx+m.tw,m.ty+m.th]].map(([x,y])=>Math.hypot(x*T-60,y*T-40))), 0);
}
function spawnSite(kind, minR, maxR){
  const base = colonyRadius();
  for(let tries=0; tries<300; tries++){
    const ang = R(0, Math.PI*2), dist = base + R(minR, maxR) + tries*0.5;
    const x = Math.cos(ang)*dist + 60, y = Math.sin(ang)*dist + 40;
    const clear = modules.every(m=>{ const cx=clamp(x,m.tx*T,(m.tx+m.tw)*T), cy=clamp(y,m.ty*T,(m.ty+m.th)*T); return Math.hypot(x-cx,y-cy) > 55; })
               && sites.every(o=>Math.hypot(o.x-x,o.y-y) > 90)
               && corridors.every(c=>{ const r=corridorRect(c,1); return !(x>r.x0-30 && x<r.x1+30 && y>r.y0-30 && y<r.y1+30); });
    if(!clear) continue;
    const site = { kind, x, y, amount: kind==='ice' ? R(260,420) : Infinity, start:0, dug:0, r: kind==='ice' ? R(16,24) : 9,
      blobs: Array.from({length:7}, ()=>({ dx:R(-1,1), dy:R(-0.7,0.7), rr:R(0.45,0.85) })) };
    site.start = site.amount;
    sites.push(site);
    return site;
  }
  return null;
}
function siteName(site){ return site.kind==='ice' ? 'the ice field' : 'the regolith pit'; }
function doorToward(m, x, y){
  if(m.built>=1) return frontDoor(m);
  const b = { x0:m.tx*T, y0:m.ty*T, x1:(m.tx+m.tw)*T, y1:(m.ty+m.th)*T };
  const cx = clamp(x,b.x0,b.x1), cy = clamp(y,b.y0,b.y1);
  const dl=cx-b.x0, dr=b.x1-cx, dt=cy-b.y0, db=b.y1-cy, mn=Math.min(dl,dr,dt,db);
  if(mn===dl) return {x:b.x0, y:cy}; if(mn===dr) return {x:b.x1, y:cy}; if(mn===dt) return {x:cx, y:b.y0}; return {x:cx, y:b.y1};
}
function chooseSite(){
  const live = sites.filter(x=>x.kind==='regolith' || x.amount>0);
  const iceSites = live.filter(x=>x.kind==='ice'), pits = live.filter(x=>x.kind==='regolith');
  const iceNeed = 1 - Math.min(1, ice/DOME_GOAL.ice), regNeed = 1 - Math.min(1, regolith/DOME_GOAL.regolith);
  const wantIce = ice < 30 || (iceSites.length && Math.random() < (iceNeed+0.15)/(iceNeed+regNeed+0.3));
  const pool = wantIce && iceSites.length ? iceSites : pits.length ? pits : iceSites;
  if(!pool.length) return null;
  const scale = domeReady ? 2 : 1;
  if(pool===pits && regolith > DOME_GOAL.regolith*scale) return null;
  if(pool===iceSites && ice > DOME_GOAL.ice*scale) return null;
  return pick(pool);
}
function mineWill(a){ const P=a.persona; return 0.45*P.steady + 0.35*P.drive + 0.2*P.restless; }
function startMining(a, site){
  const door = doorToward(a.mod, site.x, site.y), inner = clampIn(a.mod, door);
  a.mine = { site, door, home:a.mod }; a.suitUp = true; a.job = null;
  a.tx = inner.x; a.ty = inner.y; a.state = 'toDoor';
  a.thought = `Suiting up to work ${siteName(site)}`;
}
function isBuilderish(a){
  return a.trait==='builder' || a.persona.drive>0.6 || (construction && simTime-construction.lastWork>SOL_H && a.persona.drive>0.35);
}
function nextHop(from, to){
  if(from===to) return null;
  const prev = new Map([[from,null]]), q = [from];
  while(q.length){
    const m = q.shift(); if(m===to) break;
    for(const c of neighbors(m)){ const o = other(c,m); if(!prev.has(o)){ prev.set(o,{m,c}); q.push(o); } }
  }
  if(!prev.has(to)) return null;
  let st = prev.get(to);
  while(st && st.m!==from) st = prev.get(st.m);
  return st ? st.c : null;
}
function workThought(J){
  const b = J.m.built;
  return b<0.4 ? `Laying the tunnel out to ${J.m.name}` : b<0.55 ? `Pouring the foundation for ${J.m.name}` :
         b<0.8 ? `Raising the frame of ${J.m.name}` : `Sealing the roof panels on ${J.m.name}`;
}
function enterModule(a, m){
  a.mod=m; a.state='walk'; a.job=null; a.wait=0; a.path=null;
  const q=clampIn(m,{x:a.x,y:a.y}); a.x=q.x; a.y=q.y; setTarget(a); setThought(a);
}
function finishEva(a){
  if(a.after==='mine' && a.mine){
    a.state='mining'; a.workLeft=R(5,9); a.wait=0; a.tx=a.x; a.ty=a.y;
    a.thought = a.mine.site.kind==='ice' ? 'Cutting ice blocks' : 'Digging regolith';
    return;
  }
  if(a.after==='haul' && a.mine){
    const amt = a.load || 0, kind = a.mine.site.kind;
    if(kind==='ice') ice += amt; else regolith += amt;
    a.load = 0; const home = a.mine.home; a.mine = null;
    enterModule(a, modules.includes(home) ? home : a.mod);
    return;
  }
  if(a.after==='work'){
    if(construction && a.job===construction){
      a.state='work'; a.workLeft=R(8,16); a.wait=0;
      const p=siteWorkPoint(a.job.m); a.tx=p.x; a.ty=p.y; a.thought=workThought(a.job);
    } else enterModule(a, a.job && a.job.m.built>=1 ? a.job.m : a.mod);
  } else enterModule(a, a.mod);
}
function setThought(a){
  if(construction && isBuilderish(a) && Math.random()<.5){ a.thought='Planning the work on '+construction.m.name; return; }
  a.thought = pick(THOUGHTS[a.mod.kind]);
}
function decide(a){
  if(a.talk){
    if(simTime < a.talk.until && agents.includes(a.talk.with)){ a.wait = a.talk.until-simTime+0.01; return; }
    a.talk = null;
  }
  if(construction && isBuilderish(a) && Math.random()<0.55){
    const J = construction;
    if(a.mod===J.p){
      a.job=J; a.cor=J.c; a.fromA=true; a.suitUp=true;
      const q=clampIn(a.mod, J.c.p1); a.tx=q.x; a.ty=q.y; a.state='toDoor';
      a.thought='Suiting up to work on '+J.m.name; return;
    }
    const hop = nextHop(a.mod, J.p);
    if(hop){
      a.cor=hop; a.fromA=(hop.a===a.mod);
      const q=clampIn(a.mod, a.fromA?hop.p1:hop.p2); a.tx=q.x; a.ty=q.y; a.state='toDoor';
      a.thought='Heading out to help build '+J.m.name; return;
    }
  }
  const scale = domeReady ? 2 : 1, needMax = Math.max(0, 1-ice/(DOME_GOAL.ice*scale), 1-regolith/(DOME_GOAL.regolith*scale));
  if(sites.length && !a.mine && Math.random() < 0.22*mineWill(a)*(0.12 + 0.88*needMax)){
    const site = chooseSite();
    if(site){ startMining(a, site); return; }
  }
  const nb = neighbors(a.mod);
  const P = a.persona;
  if(nb.length && Math.random() < 0.08 + 0.32*P.restless){
    const pull = { workshop:P.drive, archive:P.curiosity, comms:P.curiosity*.8, habitat:P.sociability, garden:P.care, core:P.steady*.7 };
    const ws = nb.map(x=>0.15 + (pull[other(x,a.mod).kind]||0)**2);
    let r = Math.random()*ws.reduce((s,v)=>s+v,0), c = nb[0];
    for(let i=0;i<nb.length;i++){ r -= ws[i]; if(r<=0){ c = nb[i]; break; } }
    a.cor = c; a.fromA = (c.a===a.mod);
    const q = clampIn(a.mod, a.fromA ? c.p1 : c.p2);
    a.tx=q.x; a.ty=q.y; a.state='toDoor';
    a.thought = 'Heading to '+other(c,a.mod).name;
  } else {
    a.state='walk'; setTarget(a);
    if(Math.random()<.3) setThought(a);
  }
}
function updateAgent(a, dt){
  if(a.state==='eva'){
    const tg = a.path && a.path[0];
    if(!tg){ finishEva(a); return; }
    const dx=tg.x-a.x, dy=tg.y-a.y, d=Math.hypot(dx,dy);
    if(d<0.8){ a.path.shift(); if(!a.path.length) finishEva(a); return; }
    const sp=8*dt; a.x+=dx/d*Math.min(sp,d); a.y+=dy/d*Math.min(sp,d);
    if(Math.abs(dx)>0.2) a.face = dx<0 ? -1 : 1;
    return;
  }
  if(a.state==='mining'){
    const st = a.mine.site;
    a.workLeft -= dt;
    if(a.workLeft<=0 || (st.kind==='ice' && st.amount<=0)){
      let amt = (st.kind==='ice' ? R(6,10) : R(8,14)) * (0.7 + a.persona.drive*0.6);
      if(st.kind==='ice'){ amt = Math.min(amt, Math.max(0, st.amount)); st.amount -= amt; }
      st.dug += amt; a.load = amt;
      if(st.kind==='ice' && st.amount<=0 && !st.gone){
        st.gone = true;
        addLog('An ice field ran dry. Scouts are looking farther out', '#cfefff');
        const nu = sites.filter(x=>x.kind==='ice' && x.amount>0).length < 2 ? spawnSite('ice', 60, 150) : null;
        if(nu) addLog(`${a.name} spotted fresh ice on the way back`, '#cfefff');
      }
      a.state='eva'; a.after='haul';
      const inner = clampIn(a.mine.home, a.mine.door);
      a.path=[{x:a.mine.door.x, y:a.mine.door.y}, inner];
      a.thought = st.kind==='ice' ? 'Hauling ice back' : 'Hauling regolith back';
      return;
    }
    if(a.wait>0){ a.wait-=dt; return; }
    const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
    if(d<0.6){ a.wait=R(0.6,2); const ang=R(0,6.283), rr=st.r*R(0.2,0.8); a.tx=st.x+Math.cos(ang)*rr; a.ty=st.y+Math.sin(ang)*rr*0.7; return; }
    const sp=4*dt; a.x+=dx/d*Math.min(sp,d); a.y+=dy/d*Math.min(sp,d);
    if(Math.abs(dx)>0.2) a.face = dx<0 ? -1 : 1;
    return;
  }
  if(a.state==='work'){
    if(!construction || a.job!==construction){ enterModule(a, a.job && a.job.m.built>=1 ? a.job.m : a.mod); return; }
    a.workLeft -= dt;
    if(a.workLeft<=0){
      const c=a.job.c; a.state='eva'; a.after='enter'; a.job=null;
      a.path=[{x:c.p2.x,y:c.p2.y},{x:c.p1.x,y:c.p1.y}, clampIn(a.mod,c.p1)];
      a.thought='Heading back inside after a long shift'; return;
    }
    if(a.wait>0){ a.wait-=dt; return; }
    const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
    if(d<0.8){ a.wait=R(.8,2.4); const p=siteWorkPoint(a.job.m); a.tx=p.x; a.ty=p.y; a.face = p.x<a.x ? -1 : 1; a.thought=workThought(a.job); return; }
    const sp=6*dt; a.x+=dx/d*Math.min(sp,d); a.y+=dy/d*Math.min(sp,d);
    if(Math.abs(dx)>0.2) a.face = dx<0 ? -1 : 1;
    return;
  }
  if(a.state==='transit'){
    const c=a.cor; a.t += dt*22/Math.max(1,c.len);
    if(a.t>=1){
      const dest = a.fromA ? c.b : c.a;
      const q = clampIn(dest, a.fromA ? c.p2 : c.p1);
      a.mod=dest; a.x=q.x; a.y=q.y; a.state='walk'; a.wait=0; setTarget(a); setThought(a);
    }
    return;
  }
  if(a.wait>0){ a.wait-=dt; if(a.wait<=0) decide(a); return; }
  const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
  if(d<0.8){
    if(a.state==='toDoor'){
      if(a.suitUp && a.mine){
        a.suitUp=false;
        const st = a.mine.site, ang = R(0,6.283), rr = st.r*R(0.3,0.8);
        a.state='eva'; a.after='mine';
        a.path=[{x:a.mine.door.x,y:a.mine.door.y}, {x:st.x+Math.cos(ang)*rr, y:st.y+Math.sin(ang)*rr*0.7}];
        a.thought = `Walking out to ${siteName(st)}`;
        return;
      }
      if(a.suitUp){
        a.suitUp=false;
        if(!construction || a.job!==construction){ a.job=null; a.state='walk'; setTarget(a); return; }
        const c=a.job.c; a.state='eva'; a.after='work';
        a.path=[{x:c.p1.x,y:c.p1.y},{x:c.p2.x,y:c.p2.y}, randomPoint(a.job.m)];
        return;
      }
      a.state='transit'; a.t=0; return;
    }
    if(a.talk && simTime<a.talk.until){ a.wait = a.talk.until-simTime+0.01; a.face = a.talk.with.x < a.x ? -1 : 1; return; }
    a.wait=R(1,4)*(0.5+a.persona.steady*1.2); return;
  }
  const sp=(a.state==='toDoor'?16:10)*(0.75+a.persona.drive*0.5)*dt;
  a.x += dx/d*Math.min(sp,d); a.y += dy/d*Math.min(sp,d);
  if(Math.abs(dx)>0.2) a.face = dx<0 ? -1 : 1;
}

/* ---------- economy & events ---------- */
function production(){ return (count('core')*1.2 + count('garden')*0.45) * (simTime<fortuneUntil ? 1.8 : 1); }
function consumption(){ return agents.length*0.075 + count('comms')*0.1; }
function cap(){ return 120 + count('core')*80; }

function step(dt){
  simTime += dt;
  energy = clamp(energy + (production()-consumption())*dt, 0, Math.max(energy, cap()));
  if(energy > cap()) energy -= (energy-cap())*0.05*dt;

  ice = Math.max(0, ice - agents.length*0.012*dt);
  if(!sites.some(x=>x.kind==='ice' && x.amount>0) && Math.random() < dt*0.05){ if(spawnSite('ice', 60, 160)) addLog('Scouts found a new ice field', '#cfefff'); }
  if(ice<=0 && simTime-thirstWarnAt > SOL_H*2){ thirstWarnAt = simTime; addLog('The water tanks are dry. No one will start a family until ice comes in', '#cfefff'); }
  agents.forEach(a=>updateAgent(a,dt));

  // conversations: sociable beings seek each other out
  talkTimer += dt;
  if(talkTimer > 1){
    talkTimer = 0;
    modules.forEach(m=>{
      if(m.built<1) return;
      const idle = agents.filter(a=>a.mod===m && isInside(a) && a.state!=='toDoor' && !a.talk);
      if(idle.length<2) return;
      const warmth = idle.reduce((sum,a)=>sum+a.persona.sociability,0)/idle.length;
      if(Math.random() > 0.12+0.35*warmth) return;
      const a = idle.slice().sort((p,q)=>q.persona.sociability*Math.random()-p.persona.sociability*Math.random())[0];
      const b = idle.filter(x=>x!==a).sort((p,q)=>Math.hypot(p.x-a.x,p.y-a.y)-Math.hypot(q.x-a.x,q.y-a.y))[0];
      const until = simTime + R(1.2, 2.8)*(0.7+(a.persona.sociability+b.persona.sociability)*0.4);
      a.talk = { with:b, until, start:simTime, line:talkLine(a,b), first:true };
      b.talk = { with:a, until, start:simTime, line:Math.random()<.5 ? pick(REPLY) : talkLine(b,a), first:false };
      const side = a.x < b.x ? -1 : 1;
      a.tx = clamp(b.x + side*4, inner(m).x0+2, inner(m).x1-2); a.ty = b.y; a.state='walk'; a.wait=0;
      b.wait = until-simTime; b.face = side;
    });
  }

  // births
  birthTimer += dt;
  if(birthTimer > 4){
    birthTimer = 0;
    const capacity = count('habitat')*6 + 2;
    modules.filter(m=>m.kind==='habitat' && m.built>=1).forEach(m=>{
      const here = agents.filter(a=>a.mod===m && isInside(a));
      const graced = (graceFor.get(m.id)||-1) > simTime;
      const need = (agents.length < 4 || graced) ? 1 : 2;
      const warmth = here.reduce((s,a)=>s+a.persona.sociability+a.persona.care,0)/Math.max(1,here.length);
      if(here.length>=need && energy>45 && ice>5 && production()-consumption()>0.2 && agents.length<capacity && Math.random()<0.15+0.25*warmth+(graced?0.4:0)){
        energy -= 18;
        const parent = pick(here);
        const kid = makeAgent(m);
        addLog(`${kid.name} was born in ${m.name}${here.length>1 ? ', raised by '+parent.name : ''}`, TRAITS[kid.trait].color);
        m.pulse = 1;
      }
    });
  }

  // builders decide to expand
  buildTimer += dt;
  if(buildTimer > 5){
    buildTimer = 0;
    const cost = 50 + modules.length*6;
    const builderReady = agents.some(a=>a.trait==='builder' && a.mod.kind==='workshop' && isInside(a));
    const kind = chooseKind();
    const need = (kind==='core'||kind==='garden') && production()-consumption()<0.6 ? cost*0.4 : cost;   // power shortages get priority
    const regCost = 15 + modules.length*2;
    if(!construction && builderReady && energy > need){
      if(regolith < regCost){
        if(simTime-regolithWarnAt > SOL_H*2){ regolithWarnAt = simTime; addLog('The builders want to expand, but they need more regolith', '#c9784a'); }
      } else if(startConstruction(kind, false)){ energy -= need; regolith -= regCost; }
    }
    if(!domeReady && agents.length>=DOME_GOAL.pop && ice>=DOME_GOAL.ice && regolith>=DOME_GOAL.regolith){
      domeReady = true;
      addLog('The colony has gathered everything it needs to raise its first dome', '#ffd59a');
    }
  }

  // construction progress
  if(construction){
    const crew = agents.filter(a=>a.state==='work' && a.job===construction);
    if(crew.length) construction.lastWork = simTime;
    const inc = crew.reduce((sum,a)=>sum+(0.6+a.persona.drive)*dt/26, 0);   // no one on site, no progress
    construction.m.built = Math.min(1, construction.m.built+inc);
    construction.c.built = construction.m.built;
    if(construction.m.built>=1){
      addLog(`${construction.m.name} is sealed and pressurized${crew.length ? `. ${crew.length} ${crew.length===1?'builder heads':'builders head'} inside` : ''}`, KINDS[construction.m.kind].color);
      construction.m.pulse = 1;
      crew.forEach(a=>enterModule(a, construction.m));
      construction = null;
      if(!userMoved) fitView();
    }
  }

  // starvation
  if(energy<=0.5 && agents.length){
    starveTimer += dt;
    if(starveTimer>3){
      starveTimer=0;
      if(Math.random()<0.4){
        const a = pick(agents);
        agents = agents.filter(x=>x!==a);
        addLog(`${a.name} faded. The station is out of energy`, '#ff4f7b');
      }
    }
  } else starveTimer = 0;

  // packets
  const live = corridors.filter(c=>c.built>=1);
  spawnAcc += dt*(live.length*0.9 + count('comms')*1.5);
  while(spawnAcc>1 && live.length){
    spawnAcc -= 1;
    let c = pick(live);
    const commsC = live.filter(x=>x.a.kind==='comms'||x.b.kind==='comms');
    if(commsC.length && Math.random()<.35) c = pick(commsC);
    const fwd = Math.random()<.5;
    const src = fwd ? c.a : c.b;
    packets.push({ c, t:0, fwd, color:KINDS[src.kind].color });
  }
  packets.forEach(p=>{ p.t += dt*48/Math.max(1,p.c.len); });
  packets = packets.filter(p=>{
    if(p.t>=1){ (p.fwd ? p.c.b : p.c.a).pulse = Math.max((p.fwd ? p.c.b : p.c.a).pulse, .5); return false; }
    return true;
  });
  modules.forEach(m=>{ m.pulse = Math.max(0, m.pulse - dt*1.5); });
}

/* ---------- log ---------- */
const logEl = document.getElementById('log');
const logItems = [];
function addLog(text, color){
  logItems.push({ text, color });
  while(logItems.length>5) logItems.shift();
  logEl.innerHTML = '';
  logItems.forEach((it,i)=>{
    const li = document.createElement('li');
    li.textContent = it.text;
    li.style.setProperty('--c', it.color || '#4ff0ff');
    li.style.opacity = (0.45 + 0.55*(i+1)/logItems.length).toFixed(2);
    logEl.appendChild(li);

/* ---------- canvas & camera ---------- */
const cv = document.getElementById('world'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
const cam = { x:0, y:0, z:3 }; let camTarget=null, userMoved=false;
function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
}
window.addEventListener('resize', ()=>{ resize(); if(!userMoved) fitView(true); });

function fitView(instant){
  const ms = modules.length ? modules : [{tx:0,ty:0,tw:10,th:10}];
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  ms.forEach(m=>{ x0=Math.min(x0,m.tx*T); y0=Math.min(y0,m.ty*T); x1=Math.max(x1,(m.tx+m.tw)*T); y1=Math.max(y1,(m.ty+m.th)*T); });
  const pad = 6*T, bw=x1-x0+pad*2, bh=y1-y0+pad*2;
  const usableH = H - (W<720 ? 260 : 180);
  const z = clamp(Math.min(W/bw, Math.max(120,usableH)/bh), 0.8, 5);
  camTarget = { x:(x0+x1)/2, y:(y0+y1)/2 + (W<720 ? 10 : 0)/z, z };
  if(instant){ Object.assign(cam, camTarget); camTarget=null; }
}

/* ---------- Jezero Crater terrain (generated once) ---------- */
const TER = { x0:-1400, y0:-1400, size:2800, px:2 };
const SX = R(0,500), SY = R(0,500);
const lerp = (a,b,t) => a+(b-a)*t;
function hash(x,y){ let h = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263); h = Math.imul(h ^ (h>>>13), 1274126177); return ((h ^ (h>>>16))>>>0)/4294967296; }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi, u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){ let sum=0, amp=.5, f=1; for(let i=0;i<4;i++){ sum+=amp*vnoise(x*f,y*f); f*=2; amp*=.5; } return sum/0.9375; }
let terrain = null;
function buildTerrain(){
  const S = TER.size, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = true;
  const toC = (wx,wy) => [wx-TER.x0, wy-TER.y0];
  // 1. broad color field, painted smooth
  const N = 350, k = S/N, lo = document.createElement('canvas'); lo.width = lo.height = N;
  const lg = lo.getContext('2d'), img = lg.createImageData(N,N), d = img.data;
  const pal = [[92,38,21],[120,52,29],[148,72,39],[172,93,55],[195,117,75],[214,144,102]];
  const ax=-1450, ay=-300;
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    const wx = TER.x0+(i+0.5)*k, wy = TER.y0+(j+0.5)*k;
    const v = fbm(wx/380+SX, wy/380+SY)*0.72 + fbm(wx/1100+SY, wy/1100+SX)*0.28;
    const kk = clamp((v-0.3)*2.3, 0, 0.999)*(pal.length-1), i0 = Math.floor(kk), fr = kk-i0, c0 = pal[i0], c1 = pal[Math.min(pal.length-1,i0+1)];
    let r=lerp(c0[0],c1[0],fr), gg=lerp(c0[1],c1[1],fr), b=lerp(c0[2],c1[2],fr);
    const ddx=wx-ax, ddy=wy-ay, dist=Math.hypot(ddx,ddy), ang=Math.atan2(ddy,ddx);
    if(ddx>0 && Math.abs(ang)<0.9 && dist<1150){ const t = Math.min(1,(1-dist/1150)*(1-Math.abs(ang)/0.9)*2.2)*0.55; r=lerp(r,214,t); gg=lerp(gg,160,t); b=lerp(b,112,t); }
    const o=(j*N+i)*4; d[o]=r; d[o+1]=gg; d[o+2]=b; d[o+3]=255;
  }
  lg.putImageData(img,0,0); g.drawImage(lo,0,0,S,S);
  // 2. soft mottling
  const M = 700, mk = S/M, mc = document.createElement('canvas'); mc.width = mc.height = M;
  const mg = mc.getContext('2d'), mi = mg.createImageData(M,M), md = mi.data;
  for(let j=0;j<M;j++) for(let i=0;i<M;i++){
    const wx = TER.x0+i*mk, wy = TER.y0+j*mk;
    const v = vnoise(wx/22+SX, wy/22+SY)*0.6 + vnoise(wx/7+SY, wy/7+SX)*0.4, gr = 128 + (v-0.5)*120, o=(j*M+i)*4;
    md[o]=gr; md[o+1]=gr; md[o+2]=gr; md[o+3]=255;
  }
  mg.putImageData(mi,0,0);
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.32; g.drawImage(mc,0,0,S,S);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  // 3. ancient delta: layered sediment bands
  { const [cx,cy] = toC(ax,ay);
    g.save(); g.beginPath(); g.moveTo(cx,cy); g.arc(cx,cy,1150,-0.88,0.88); g.closePath(); g.clip();
    for(let r=50; r<1130; r+=R(6,15)){
      const light = Math.random()<0.55, fade = 1-r/1150;
      g.strokeStyle = light ? `rgba(238,196,150,${0.05+0.16*fade})` : `rgba(110,52,26,${0.04+0.12*fade})`;
      g.lineWidth = R(1.2,4.5); g.beginPath();
      for(let t=-0.88; t<=0.88; t+=0.02){ const rr = r + (vnoise(r*0.05+t*6, t*3)-0.5)*14; const x=cx+Math.cos(t)*rr, y=cy+Math.sin(t)*rr; t===-0.88 ? g.moveTo(x,y) : g.lineTo(x,y); }
      g.stroke();
    }
    g.restore(); }
  // 4. dune ripples, wind from the south-west
  { const wa = -0.6, px = Math.cos(wa+Math.PI/2), py = Math.sin(wa+Math.PI/2), lit = new Path2D(), shade = new Path2D();
    for(let gy=0; gy<S; gy+=9) for(let gx=0; gx<S; gx+=9){
      const wx = TER.x0+gx, wy = TER.y0+gy, m = fbm(wx/560+40, wy/560+90);
      if(m < 0.56 || hash(gx,gy) < 0.25) continue;
      const cx = gx + R(-3,3), cy = gy + R(-3,3), L = R(5,11)*Math.min(1,(m-0.56)/0.12+0.4), bend = R(-1.5,1.5);
      const x0=cx-px*L, y0=cy-py*L, x1=cx+px*L, y1=cy+py*L, qx=cx+Math.cos(wa)*bend, qy=cy+Math.sin(wa)*bend;
      lit.moveTo(x0,y0); lit.quadraticCurveTo(qx,qy,x1,y1);
      shade.moveTo(x0+Math.cos(wa)*1.4,y0+Math.sin(wa)*1.4); shade.quadraticCurveTo(qx+Math.cos(wa)*1.4,qy+Math.sin(wa)*1.4,x1+Math.cos(wa)*1.4,y1+Math.sin(wa)*1.4);
    }
    g.lineCap = 'round';
    g.strokeStyle = 'rgba(105,46,22,0.22)'; g.lineWidth = 1.3; g.stroke(shade);
    g.strokeStyle = 'rgba(236,170,120,0.24)'; g.lineWidth = 1.1; g.stroke(lit); }
  // 5. dust streaks
  for(let n=0;n<260;n++){ g.save(); g.translate(R(0,S),R(0,S)); g.rotate(-0.6); g.fillStyle = Math.random()<.6 ? 'rgba(235,175,125,0.06)' : 'rgba(90,38,18,0.05)'; g.beginPath(); g.ellipse(0,0,R(40,140),R(3,9),0,0,6.283); g.fill(); g.restore(); }
  // 6. craters, lit from the upper left
  for(let n=0;n<95;n++){
    const wx=R(-1350,1350), wy=R(-1350,1350); if(Math.hypot(wx-60,wy-40)<240) continue;
    const [cx,cy] = toC(wx,wy), r = Math.random()<0.8 ? R(5,18) : R(18,55);
    let gr = g.createRadialGradient(cx,cy,r*0.8,cx,cy,r*2.1); gr.addColorStop(0,'rgba(226,160,112,0.16)'); gr.addColorStop(1,'rgba(226,160,112,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(cx,cy,r*2.1,0,6.283); g.fill();
    let lgd = g.createLinearGradient(cx-r,cy-r,cx+r,cy+r); lgd.addColorStop(0,'rgba(58,22,10,0.62)'); lgd.addColorStop(0.55,'rgba(120,56,30,0.25)'); lgd.addColorStop(1,'rgba(232,168,118,0.45)');
    g.fillStyle = lgd; g.beginPath(); g.ellipse(cx,cy,r,r*0.92,0,0,6.283); g.fill();
    let rim = g.createLinearGradient(cx-r,cy-r,cx+r,cy+r); rim.addColorStop(0,'rgba(240,184,138,0.75)'); rim.addColorStop(1,'rgba(70,28,12,0.55)');
    g.strokeStyle = rim; g.lineWidth = Math.max(1, r*0.13); g.beginPath(); g.ellipse(cx,cy,r*1.04,r*0.96,0,0,6.283); g.stroke();
  }
  // 7. rocks and boulders with shadows
  const rockPoly = (x,y,s,sx=1) => { g.beginPath(); const n=6; for(let i=0;i<n;i++){ const t=i/n*6.283, rr=s*(0.7+hash(Math.round(x*7)+i,Math.round(y*3))*0.45); const px=x+Math.cos(t)*rr*sx, py=y+Math.sin(t)*rr*0.72; i? g.lineTo(px,py) : g.moveTo(px,py); } g.closePath(); };
  for(let n=0;n<3200;n++){
    const roll = Math.random(), s = roll<0.72 ? R(0.9,2.2) : roll<0.96 ? R(2.2,4.5) : R(4.5,10);
    const wx=R(-1390,1390), wy=R(-1390,1390); if(s>2.2 && Math.hypot(wx-60,wy-40)<230) continue;
    const [x,y] = toC(wx,wy);
    g.fillStyle = 'rgba(34,13,5,0.42)'; rockPoly(x+s*0.4,y+s*0.32,s*1.05); g.fill();
    const base = Math.random(); g.fillStyle = `rgb(${86+base*30|0},${38+base*14|0},${20+base*8|0})`; rockPoly(x,y,s); g.fill();
    g.fillStyle = 'rgba(196,118,74,0.85)'; rockPoly(x-s*0.2,y-s*0.22,s*0.58); g.fill();
    if(s>4){ g.fillStyle='rgba(236,176,130,0.55)'; rockPoly(x-s*0.32,y-s*0.34,s*0.25); g.fill(); }
  }
  // 8. pebbles and grit
  for(let n=0;n<26000;n++){ const x=R(0,S), y=R(0,S); g.fillStyle = Math.random()<.5 ? 'rgba(60,24,10,0.35)' : 'rgba(232,170,124,0.3)'; g.fillRect(x,y,R(0.5,1.1),R(0.5,1)); }
  terrain = c;
}

function buildMask(img, test, color){
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img,0,0);
  const d = g.getImageData(0,0,c.width,c.height), px = d.data, W = c.width, H = c.height, m0 = new Uint8Array(W*H);

  for(let i=0;i<W*H;i++){
    const x=i%W, y=(i/W)|0; let n=0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const xx=x+dx, yy=y+dy; if(xx>=0&&yy>=0&&xx<W&&yy<H) n+=m0[yy*W+xx]; }

  }
  g.putImageData(d,0,0); return c;

Object.entries(SPR_DATA).forEach(([kind, def])=>{

      : buildMask(base, (r,g,b)=> r>200 && g>100 && g<215 && b<120 && r-b>110, [255,175,60]);

function recolor(img, f){
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img,0,0);
  const d = g.getImageData(0,0,c.width,c.height), px = d.data;
  for(let i=0;i<px.length;i+=4){ if(!px[i+3]) continue; const l = px[i]*0.3+px[i+1]*0.59+px[i+2]*0.11, o = f(l); px[i]=o[0]; px[i+1]=o[1]; px[i+2]=o[2]; px[i+3]=Math.min(px[i+3], o[3]); }

    const dp = frontDoor(m);
    const want = agents.some(a=> (a.mine && a.mine.home===m && (a.suitUp || isOutside(a)) && Math.hypot(a.x-dp.x, a.y-dp.y) < 18));
    m.doorOpen = (m.doorOpen||0) + ((want?1:0) - (m.doorOpen||0)) * Math.min(1, realDt*4);
  });
}

/* ---------- light & shadow from the Mars clock ---------- */
function lightLevel(h){ if(h<5||h>=19) return 0; if(h<7) return (h-5)/2; if(h<17) return 1; return (19-h)/2; }
function duskAmt(h){ return Math.max(0, 1-Math.abs(h-6.2)/1.3, 1-Math.abs(h-17.8)/1.3); }
function shadowVec(h, L){ return { dx: clamp((h-12)/6,-1.4,1.4)*9, dy: -6, a: 0.32*L }; }

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function render(time){
  if(camTarget){
    const k = 0.08;
    cam.x += (camTarget.x-cam.x)*k; cam.y += (camTarget.y-cam.y)*k; cam.z += (camTarget.z-cam.z)*k;
    if(Math.abs(camTarget.z-cam.z)<0.002 && Math.abs(camTarget.x-cam.x)<0.5) camTarget=null;
  }
  const h = marsHour(simTime), L = lightLevel(h), dusk = duskAmt(h), night = 1-L, sh = shadowVec(h, L);
  const cutBase = clamp((cam.z-4.6)/0.8, 0, 1);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#5a2a16'; ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z, DPR*(W/2-cam.x*cam.z), DPR*(H/2-cam.y*cam.z));
  ctx.imageSmoothingEnabled = false;
  if(terrain){ ctx.imageSmoothingEnabled = true; ctx.drawImage(terrain, TER.x0, TER.y0, TER.size, TER.size); ctx.imageSmoothingEnabled = false; }

  sites.forEach(st=>drawSite2(st, time));
  corridors.forEach(c=>drawCorridor(c, time, sh));
  agents.filter(a=>a.state==='transit').forEach(a=>{
    const c=a.cor, t = a.fromA ? a.t : 1-a.t;
    drawBeing(c.p1.x+(c.p2.x-c.p1.x)*t, c.p1.y+(c.p2.y-c.p1.y)*t, a, time);
  });
  modules.slice().sort((p,q)=>(p.ty+p.th)-(q.ty+q.th)).forEach(m=>drawModule(m, time, sh, selected===m && selected.peek ? 1 : cutBase));
  agents.filter(isOutside).sort((p,q)=>p.y-q.y).forEach(a=>drawSuit(a, time));
  drawDust();

  // daylight, blue Martian dusk, night
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = '#ffe6cc'; ctx.globalAlpha = 0.18*L; ctx.fillRect(0,0,W,H);
  if(dusk>0){ ctx.fillStyle = '#7e98dc'; ctx.globalAlpha = 0.42*dusk; ctx.fillRect(0,0,W,H); }
  if(night>0){ ctx.fillStyle = '#262b52'; ctx.globalAlpha = 0.86*night; ctx.fillRect(0,0,W,H); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // lights: windows, lamps, beacons, data pulses
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z, DPR*(W/2-cam.x*cam.z), DPR*(H/2-cam.y*cam.z));
  ctx.globalCompositeOperation = 'lighter';
  drawLights(time, night, cutBase);
  drawSparks(time);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  drawBubbles(time, cutBase);
  if(selected) drawSelection(selected, time, selected.peek ? 1 : cutBase);

  // labels and build progress in screen space, so text stays readable at any zoom
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const scr = (wx,wy) => [ (wx-cam.x)*cam.z + W/2, (wy-cam.y)*cam.z + H/2 ];
  ctx.font = '600 12px "Chakra Petch", system-ui, sans-serif'; ctx.textBaseline = 'middle';
  const tag = (txt, sx, sy, col) => {
    const tw = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(14,9,10,0.74)'; rrPath(sx-tw/2-7, sy-9, tw+14, 18, 5); ctx.fill();
    ctx.fillStyle = col; ctx.fillText(txt, sx-tw/2, sy+0.5);
  };
  modules.forEach(m=>{
    const k=KINDS[m.kind], [sx, sy] = scr((m.tx+m.tw/2)*T, m.ty*T);
    if(m.built<1){
      const crew = agents.filter(a=>a.state==='work' && a.job && a.job.m===m).length;
      const bw = Math.max(46, Math.min(110, m.tw*T*cam.z*0.5)), by = sy - 12;
      ctx.fillStyle = 'rgba(14,9,10,0.8)'; rrPath(sx-bw/2-3, by-4, bw+6, 8, 4); ctx.fill();
      ctx.fillStyle = k.color; rrPath(sx-bw/2, by-1.5, Math.max(3,bw*m.built), 3, 1.5); ctx.fill();
      if(cam.z>1.5 || selected===m) tag(`${m.name}  ${Math.round(m.built*100)}%  \u00b7  ${crew ? crew+(crew===1?' builder':' builders') : 'waiting for builders'}`, sx, by-16, k.color);
    } else if(cam.z>2.1 || selected===m){
      tag(m.name, sx, sy-14, k.color);
    }
  });
  if(cam.z>2.1) sites.forEach(st=>{
    if(st.kind==='ice' && st.amount<=0) return;
    const [sx, sy] = scr(st.x, st.y-st.r);
    tag(st.kind==='ice' ? 'Ice field' : 'Regolith pit', sx, sy-14, st.kind==='ice' ? '#cfefff' : '#e0a070');
  });


  if(meteor){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const k = (performance.now()-meteor.t0)/1600;
    if(k>=1) meteor = null;
    else {
      const len = Math.min(W,H)*0.9, hx = meteor.x*W + Math.cos(meteor.ang)*len*k, hy = meteor.y*H + Math.sin(meteor.ang)*len*k;
      const tail = 140, g = ctx.createLinearGradient(hx,hy, hx-Math.cos(meteor.ang)*tail, hy-Math.sin(meteor.ang)*tail);
      g.addColorStop(0,`rgba(255,244,214,${1-k})`); g.addColorStop(1,'rgba(255,200,140,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx-Math.cos(meteor.ang)*tail, hy-Math.sin(meteor.ang)*tail); ctx.stroke();
    }
  }
}

/* ---------- selection ---------- */
function rrPath(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); }
function drawSelection(m, time, cut){
  const S = artFor(m), x=m.tx*T, y=m.ty*T, w=m.tw*T, h=m.th*T, pulse = 0.62 + 0.38*Math.sin(time*3.2);
  ctx.save();
  if(S && m.built>=1 && cut<0.5){
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 0.3*pulse; ctx.drawImage(S.outline, x-4.6, y-4.6, w+9.2, h+9.2);
    ctx.globalAlpha = pulse; ctx.drawImage(S.outline, x-3, y-3, w+6, h+6);
  } else {
    ctx.strokeStyle = '#fff4de';
    ctx.globalAlpha = 0.25*pulse; ctx.lineWidth = 2.6; rrPath(x-4, y-4, w+8, h+8, 4); ctx.stroke();
    ctx.globalAlpha = pulse; ctx.lineWidth = 0.8; rrPath(x-4, y-4, w+8, h+8, 4); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- talk bubbles ---------- */
function drawBubbles(time, cutBase){
  const showWords = cam.z >= 3.0;
  ctx.font = '4px "Pixelify Sans", ui-monospace, monospace'; ctx.textBaseline = 'middle';
  agents.forEach(a=>{
    const t = a.talk;
    if(!t || simTime>=t.until || !isInside(a) || a.state==='toDoor') return;
    const near = Math.hypot(a.x-t.with.x, a.y-t.with.y) < 10;
    if(!near) return;
    const phase = Math.floor((simTime-t.start)/0.45) % 2;
    const speaking = (phase===0) === t.first;
    if(!speaking) return;
    const words = showWords && (a.mod===selected || cutBase>0.5);
    const tw = words ? ctx.measureText(t.line).width : 6;
    const bw = tw+4, bh = words ? 6 : 4.5, bx = a.x - (a.face>0 ? 1 : bw-1), by = a.y - 8.5*(a.tall||1) - bh;
    ctx.fillStyle = 'rgba(30,18,14,0.55)'; ctx.fillRect(bx+0.5, by+0.5, bw, bh);
    ctx.fillStyle = '#f6f1e8'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillRect(a.x + (a.face>0 ? 0 : -1.5), by+bh, 1.5, 1.2);
    ctx.fillStyle = '#3a2a24';
    if(words) ctx.fillText(t.line, bx+2, by+bh/2+0.2);
    else for(let i=0;i<3;i++){ if(Math.floor(time*4)%4>i) ctx.fillRect(bx+1.2+i*1.8, by+bh/2-0.5, 1, 1); }
  });
}

/* ---------- pressurized tunnels ---------- */
function corridorRect(c, prog){
  const ex = c.p1.x+(c.p2.x-c.p1.x)*prog, ey = c.p1.y+(c.p2.y-c.p1.y)*prog;
  return { horiz: c.p1.y===c.p2.y, x0:Math.min(c.p1.x,ex), x1:Math.max(c.p1.x,ex), y0:Math.min(c.p1.y,ey), y1:Math.max(c.p1.y,ey) };
}
function drawCorridor(c, time, sh){
  const prog = Math.min(1, c.built/0.4);
  if(c.built<1){
    const f = corridorRect(c,1);
    ctx.strokeStyle = KINDS[c.b.kind].color; ctx.globalAlpha = .55; ctx.lineWidth = .6; ctx.setLineDash([2,2]);
    ctx.beginPath(); ctx.moveTo(c.p1.x,c.p1.y); ctx.lineTo(c.p2.x,c.p2.y); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    if(prog<=0) return;
  }
  const r = corridorRect(c, prog);
  if(r.horiz){
    const L=r.x1-r.x0, y=c.p1.y;
    if(sh.a>0){ ctx.fillStyle=`rgba(50,14,4,${sh.a})`; ctx.fillRect(r.x0+sh.dx*0.4, y-3+sh.dy*0.4, L, 6); }
    ctx.fillStyle='#6e655c'; ctx.fillRect(r.x0,y-3.5,L,7);
    ctx.fillStyle='#a89e92'; ctx.fillRect(r.x0,y-3,L,5.5);
    ctx.fillStyle='#d4ccc0'; ctx.fillRect(r.x0,y-3,L,1.2);
    ctx.fillStyle='#887e73'; for(let x=r.x0+3; x<r.x1-1; x+=6) ctx.fillRect(x,y-3,1,6);
  } else {
    const L=r.y1-r.y0, x=c.p1.x;
    if(sh.a>0){ ctx.fillStyle=`rgba(50,14,4,${sh.a})`; ctx.fillRect(x-3+sh.dx*0.4, r.y0+sh.dy*0.4, 6, L); }
    ctx.fillStyle='#6e655c'; ctx.fillRect(x-3.5,r.y0,7,L);
    ctx.fillStyle='#a89e92'; ctx.fillRect(x-3,r.y0,5.5,L);
    ctx.fillStyle='#d4ccc0'; ctx.fillRect(x-3,r.y0,1.2,L);
    ctx.fillStyle='#887e73'; for(let y=r.y0+3; y<r.y1-1; y+=6) ctx.fillRect(x-3,y,6,1);
  }
}

/* ---------- buildings ---------- */
function drawRoof(m, k, x, y, w, h, time){
  const base = { habitat:'#d9d3c9', core:'#5f5b57', workshop:'#b8b0a4', archive:'#a29ea3', garden:'#5f8a63', comms:'#c9c2b7' }[m.kind];
  ctx.fillStyle = '#4e463f'; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle = base; ctx.fillRect(x,y,w,h);
  if(m.kind==='habitat'){
    ctx.fillStyle='#c6bfb4'; for(let yy=y+4; yy<y+h-1; yy+=5) ctx.fillRect(x+1,yy,w-2,1);
    ctx.fillStyle='#f0ebe3'; ctx.fillRect(x+2,y+1,w-4,1.5);
    ctx.fillStyle='#34485e'; for(let xx=x+6; xx<x+w-6; xx+=8) ctx.fillRect(xx, y+h/2-1.5, 4, 3);
  } else if(m.kind==='core'){
    ctx.fillStyle='#7c7772'; for(let xx=x+2; xx<x+w-1; xx+=4) ctx.fillRect(xx,y+2,2,h-4);
    const cx=x+w/2, cy=y+h/2, rr=Math.min(w,h)*0.26;
    ctx.fillStyle='#d6cfc4'; ctx.beginPath(); ctx.arc(cx,cy,rr+1.5,0,6.283); ctx.fill();
    ctx.fillStyle='#8f8880'; ctx.beginPath(); ctx.arc(cx,cy,rr,0,6.283); ctx.fill();
    ctx.fillStyle='#5a544e'; ctx.beginPath(); ctx.arc(cx,cy,rr*0.45,0,6.283); ctx.fill();
  } else if(m.kind==='workshop'){
    ctx.fillStyle='#a39b8f'; for(let yy=y+2; yy<y+h-1; yy+=4) ctx.fillRect(x+1,yy,w-2,2);
    ctx.fillStyle='#7d756b'; ctx.fillRect(x+w-14,y+3,9,6);
    ctx.fillStyle='#e9e2d6'; ctx.fillRect(x+2,y+1,w-4,1);
  } else if(m.kind==='archive'){
    ctx.fillStyle='#8c8890'; for(let yy=y+4; yy<y+h-3; yy+=6) for(let xx=x+4; xx<x+w-4; xx+=6) ctx.fillRect(xx,yy,3,3);
    ctx.fillStyle='#e2dde2'; ctx.fillRect(x+2,y+1,w-4,1);
  } else if(m.kind==='garden'){
    ctx.fillStyle='#4f7a52'; ctx.fillRect(x+1,y+1,w-2,h-2);
    ctx.fillStyle='#7ccf62'; for(let yy=y+3; yy<y+h-2; yy+=4) for(let xx=x+3; xx<x+w-2; xx+=3) if(hash(xx,yy)>.45) ctx.fillRect(xx,yy,1.5,1.5);
    ctx.fillStyle='rgba(225,240,230,0.55)'; for(let xx=x; xx<x+w; xx+=6) ctx.fillRect(xx,y,0.6,h); for(let yy=y; yy<y+h; yy+=6) ctx.fillRect(x,yy,w,0.6);
  } else if(m.kind==='comms'){
    ctx.fillStyle='#b3ab9f'; for(let yy=y+4; yy<y+h-1; yy+=5) ctx.fillRect(x+1,yy,w-2,1);
    const cx=x+w*0.55, cy=y+h*0.5;
    ctx.fillStyle='#8a8278'; ctx.fillRect(cx-1,cy,2,7);
    ctx.fillStyle='#ece6dc'; ctx.beginPath(); ctx.ellipse(cx,cy,10,6,-0.5,0,6.283); ctx.fill();
    ctx.strokeStyle='#9a9288'; ctx.lineWidth=.6; ctx.beginPath(); ctx.ellipse(cx,cy,10,6,-0.5,0,6.283); ctx.stroke();
    ctx.fillStyle='#6b645c'; ctx.fillRect(cx-0.6,cy-6,1.2,6);
  }
  ctx.fillStyle = k.color; ctx.fillRect(x, y, w, 1.2);
}
function drawFrontWall(m, k, x, y, w, h){
  ctx.fillStyle = '#8b8277'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = '#5c544c'; ctx.fillRect(x,y+h-1,w,1);
  ctx.fillStyle = '#a69d91'; ctx.fillRect(x,y,w,1);
  if(m.kind==='core'){ for(let xx=x; xx<x+w; xx+=4){ ctx.fillStyle = ((xx-x)/4)%2<1 ? '#d9a531' : '#2c2622'; ctx.fillRect(xx,y+h-3,2,2); } }
  if(m.kind==='workshop'){ const dw=w*0.32; ctx.fillStyle='#3f3a35'; ctx.fillRect(x+w/2-dw/2,y+1.5,dw,h-2.5); ctx.fillStyle='#57514a'; for(let yy=y+2.5; yy<y+h-1; yy+=1.6) ctx.fillRect(x+w/2-dw/2,yy,dw,0.5); }
  ctx.fillStyle = '#2f3944';
  windowsOf(m).forEach(p=>ctx.fillRect(p.x,p.y,3,2.5));
}
function windowsOf(m){
  const x=m.tx*T, y=(m.ty+m.th-1)*T, w=m.tw*T, out=[];
  if(m.built<1) return out;
  const dw = m.kind==='workshop' ? w*0.32 : 0;
  for(let xx=x+5; xx<x+w-6; xx+=9){ if(dw && Math.abs(xx+1.5-(x+w/2))<dw/2+3) continue; out.push({x:xx,y:y+2.5}); }
  return out;
}
function drawModule(m, time, sh, cut){
  const k=KINDS[m.kind], x=m.tx*T, y=m.ty*T, w=m.tw*T, h=m.th*T, WH=T;
  if(m.built<1){ drawSite(m, k, x, y, w, h, WH, time, sh); return; }
  const art0 = artFor(m);
  if(art0){
    if(sh.a>0){ ctx.save(); ctx.imageSmoothingEnabled = true; ctx.globalAlpha = sh.a*1.4; ctx.drawImage(art0.shadow, x-3+sh.dx, y-3+sh.dy*0.6, w+6, h+6); ctx.restore(); }
    if(cut>0){ ctx.fillStyle='#6f6157'; ctx.globalAlpha = cut; ctx.fillRect(x-3,y-3,w+6,h+6); ctx.globalAlpha = 1; }
  } else {
    if(sh.a>0){ ctx.fillStyle=`rgba(50,14,4,${sh.a})`; ctx.fillRect(x+sh.dx, y+sh.dy, w, h); }
    ctx.fillStyle='#6f6157'; ctx.fillRect(x-3,y-3,w+6,h+6);
    ctx.fillStyle='#87776a'; ctx.fillRect(x-3,y-3,w+6,1);
  }
  if(cut>0){
    ctx.globalAlpha = cut;
    ctx.fillStyle='#2a272c'; ctx.fillRect(x,y,w,h-WH);
    ctx.fillStyle='rgba(255,255,255,0.03)';
    for(let ty=0; ty<m.th-1; ty++) for(let tx=(ty%2); tx<m.tw; tx+=2) ctx.fillRect(x+tx*T, y+ty*T, T, T);
    m.items.forEach(it=>{
      ctx.fillStyle = '#3a3640'; ctx.fillRect(it.x,it.y,it.w,it.h);
      ctx.fillStyle = '#4a4552'; ctx.fillRect(it.x,it.y,it.w,1);
      if(Math.sin(time*it.sp+it.ph)>-0.2){ ctx.fillStyle = it.light; ctx.fillRect(it.x+1.5,it.y+2,1.5,1.5); }
    });
    agents.forEach(a=>{ if(a.mod===m && isInside(a)) drawBeing(a.x, a.y, a, time); });
    ctx.fillStyle='#cfc7bc'; ctx.fillRect(x,y,w,2); ctx.fillRect(x,y,2,h-WH); ctx.fillRect(x+w-2,y,2,h-WH);
    ctx.globalAlpha = 1;
  }
  const spr = artFor(m);
  if(cut<1){
    if(spr) drawArt(m, spr, x, y, w, h, 1-cut);
    else { ctx.globalAlpha = 1-cut; drawRoof(m, k, x, y, w, h-WH, time); ctx.globalAlpha = 1; }
  }
  if(!spr || cut>0){ if(spr) ctx.globalAlpha = cut; drawFrontWall(m, k, x, y+h-WH, w, WH); ctx.globalAlpha = 1; }
  if(m.pulse>0){ ctx.strokeStyle = k.color; ctx.globalAlpha = m.pulse*0.7; ctx.lineWidth = 1.2; ctx.strokeRect(x-2.5,y-2.5,w+5,h+5); ctx.globalAlpha = 1; }
}
function siteReveal(m){ return clamp((((m.built-0.4)/0.6) - 0.15)/0.75, 0, 1); }
function siteWorkPoint(m){
  if(!artFor(m)) return randomPoint(m);
  const Y = m.ty*T-3, Hb = m.th*T+6, seam = Y + Hb*(1-siteReveal(m));
  return { x: R(m.tx*T+5, (m.tx+m.tw)*T-5), y: clamp(seam + R(3,6), m.ty*T+6, (m.ty+m.th)*T-1) };
}
function drawSiteArt(m, S, k, x, y, w, h, time){
  const p = Math.max(0,(m.built-0.4)/0.6), X=x-3, Y=y-3, Wb=w+6, Hb=h+6;
  ctx.save(); ctx.imageSmoothingEnabled = true;
  // blueprint hologram of what is coming
  ctx.globalAlpha = 0.22 + 0.08*Math.sin(time*2.5); ctx.drawImage(S.ghost, X, Y, Wb, Hb);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#e8d9a8'; [[x,y],[x+w-1,y],[x,y+h-3],[x+w-1,y+h-3]].forEach(([sx,sy])=>ctx.fillRect(sx,sy,1,3));
  if(p>0){
    ctx.globalAlpha = Math.min(1,p/0.12); ctx.fillStyle = '#8b8178'; ctx.fillRect(X+2,Y+Hb*0.18,Wb-4,Hb*0.8);
    ctx.fillStyle = '#9c9289'; for(let yy=Y+Hb*0.18; yy<Y+Hb; yy+=7) ctx.fillRect(X+2,yy,Wb-4,0.6);
    ctx.globalAlpha = 1;
  }
  const f = siteReveal(m), g2 = clamp((p-0.45)/0.55, 0, 1);
  if(f>0){
    const top = Y + Hb*(1-f);
    ctx.save(); ctx.beginPath(); ctx.rect(X-2, top, Wb+4, Y+Hb-top+2); ctx.clip(); ctx.drawImage(S.gray, X, Y, Wb, Hb); ctx.restore();
    if(g2>0){ const t2 = Y + Hb*(1-g2); ctx.save(); ctx.beginPath(); ctx.rect(X-2, t2, Wb+4, Y+Hb-t2+2); ctx.clip(); ctx.drawImage(S.img, X, Y, Wb, Hb); ctx.restore(); }
  }
  // steel scaffolding, taken down at the end
  const sa = p<0.08 ? p/0.08 : p>0.88 ? Math.max(0,(1-p)/0.12) : 1;
  if(sa>0){
    ctx.globalAlpha = 0.85*sa; ctx.strokeStyle = '#c99a3c'; ctx.lineWidth = 0.55;
    ctx.beginPath();
    for(let xx=X+3; xx<=X+Wb-3; xx+=(Wb-6)/Math.max(2,Math.round((Wb-6)/12))){ ctx.moveTo(xx,Y+Hb*0.12); ctx.lineTo(xx,Y+Hb-2); }
    for(let yy=Y+Hb*0.12; yy<=Y+Hb-2; yy+=9){ ctx.moveTo(X+3,yy); ctx.lineTo(X+Wb-3,yy); }
    ctx.stroke();
    ctx.globalAlpha = 0.45*sa; ctx.beginPath();
    for(let xx=X+3; xx<X+Wb-12; xx+=24){ ctx.moveTo(xx,Y+Hb-2); ctx.lineTo(xx+12,Y+Hb*0.12); }
    ctx.stroke();
  }
  ctx.restore();

function drawSite(m, k, x, y, w, h, WH, time, sh){

/* ---------- beings: Jezero colonists ---------- */
const SKINS = ['#f2cba8','#e2ab8b','#c98a64','#a86b4a','#7f4d33','#5c3725'];

function shadeHex(hex, f){ const n=parseInt(hex.slice(1),16); const r=Math.min(255,((n>>16)&255)*f)|0, g=Math.min(255,((n>>8)&255)*f)|0, b=Math.min(255,(n&255)*f)|0; return `rgb(${r},${g},${b})`; }
function dressBeing(a){
  a.skin = pick(SKINS); a.hair = pick(HAIRS); a.hairStyle = RI(0,2);
  a.cSuit = SUITS[a.trait]; a.cSuitD = shadeHex(a.cSuit, 0.72); a.cSuitL = shadeHex(a.cSuit, 1.18);

}
function drawBeing(x, y, a, time){ drawColonist(x, y, a, time, false); }
function drawSuit(a, time){ drawColonist(a.x, a.y, a, time, true); }
function drawColonist(x, y, a, time, eva){
  if(!a.cSuit) dressBeing(a);
  const now = performance.now();
  if(a.lx !== undefined){
    const dx=x-a.lx, dy=y-a.ly, dd=Math.hypot(dx,dy);
    if(dd>0.004 && dd<8){ a.walkP = (a.walkP||0) + dd*1.25; a.vx=dx; a.vy=dy; a.movedAt=now; }
  }
  a.lx=x; a.ly=y;

  const pose = a.state==='work' && a.wait>0 ? 'weld' : a.state==='mining' && a.wait>0 ? 'dig' : (a.talk && simTime<a.talk.until && !moving) ? 'talk' : moving ? 'walk' : 'idle';
  let view = a.view || 'front', flip = (a.face||1) < 0;
  if(pose==='walk'){ if(Math.abs(a.vy) > Math.abs(a.vx)*1.25) view = a.vy>0 ? 'front' : 'back'; else { view='side'; flip = a.vx<0; } a.view = view==='back' ? 'back' : view==='front' ? 'front' : a.view; }
  if(pose==='weld' || pose==='dig' || pose==='talk'){ view='side'; flip = (a.face||1)<0; }
  if(pose==='idle' && view==='side') view = 'front';
  const ph = a.walkP||0, sw = pose==='walk' ? Math.sin(ph) : 0;
  const bob = pose==='walk' ? Math.abs(Math.cos(ph))*0.32 : Math.sin(time*2.2+a.id)*0.06;
  const Sc = (a.tall||1)*0.95;
  const suit = eva ? '#ebe8e2' : a.cSuit, suitD = eva ? '#bdb7ae' : a.cSuitD, boot = eva ? '#8a8379' : '#3b2f2a', glove = eva ? '#d0cac1' : a.skin;
  ctx.save(); ctx.translate(x,y); ctx.scale(flip?-Sc:Sc, Sc);
  ctx.fillStyle='rgba(30,10,4,0.33)'; ctx.beginPath(); ctx.ellipse(0,0.15,1.8,0.55,0,0,6.283); ctx.fill();
  const hipY = -2.25 - bob;
  const limb = (px,py,ang,len,wid,col,endCol,endR) => { ctx.save(); ctx.translate(px,py); ctx.rotate(ang); ctx.fillStyle=col; ctx.fillRect(-wid/2,0,wid,len); if(endCol){ ctx.fillStyle=endCol; ctx.beginPath(); ctx.arc(0,len,endR,0,6.283); ctx.fill(); } ctx.restore(); };
  // legs
  if(view==='side'){
    limb(0.05,hipY, sw*0.55, 2.0, 0.85, suitD); limb(-0.05,hipY, -sw*0.55, 2.0, 0.85, suit);
    ctx.fillStyle = boot;
    const f1x = Math.sin(sw*0.55)*-2.0, f2x = Math.sin(-sw*0.55)*-2.0;
    ctx.fillRect(f1x-0.45, hipY+Math.cos(sw*0.55)*2.0-0.35, 1.15, 0.55); ctx.fillRect(f2x-0.45, hipY+Math.cos(sw*0.55)*2.0-0.35, 1.15, 0.55);

    const l1 = pose==='walk' ? Math.max(0,sw)*0.55 : 0, l2 = pose==='walk' ? Math.max(0,-sw)*0.55 : 0;
    [[-0.55,l1],[0.55,l2]].forEach(([lx,lift])=>{ ctx.fillStyle = suitD; ctx.fillRect(lx-0.42, hipY, 0.84, 2.0-lift); ctx.fillStyle = boot; ctx.fillRect(lx-0.5, hipY+2.0-lift-0.45, 1.0, 0.55); });
  }
  // backpack (suits)
  if(eva && view==='side'){ ctx.fillStyle='#a8a196'; ctx.fillRect(-2.05, hipY-2.75, 0.95, 2.3); ctx.fillStyle=a.cSuit; ctx.fillRect(-2.05, hipY-2.75, 0.95, 0.4); }

    if(pose==='dig'){ ang = -1.0 + Math.sin(time*7+a.id)*0.9; }
    if(pose==='talk'){ ang = -0.5 + Math.sin(time*5+a.id)*0.35; }

    if(pose==='dig'){ ctx.save(); ctx.translate(0.15,shY); ctx.rotate(ang); ctx.fillStyle='#7d766d'; ctx.fillRect(-0.15,len-0.3,0.3,1.6); ctx.fillRect(-0.7,len+1.1,1.4,0.35); ctx.restore(); }
    if(a.load>0){ ctx.fillStyle = a.mine && a.mine.site.kind==='ice' ? '#dcf5ff' : '#a65a33'; ctx.fillRect(0.7, hipY-1.9, 1.7, 1.5); ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(0.7, hipY-0.6, 1.7, 0.2); }

    ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.arc(0.25,hy+0.25,1.3,0,6.283); ctx.fill();
    ctx.fillStyle = '#f5f3ef'; ctx.beginPath(); ctx.arc(-0.1,hy-0.1,1.3,0,6.283); ctx.fill();
    if(view==='side'){ ctx.fillStyle='#2b4660'; ctx.beginPath(); ctx.ellipse(0.62,hy+0.05,0.72,0.88,0,0,6.283); ctx.fill(); ctx.fillStyle='#c79a4a'; ctx.globalAlpha=0.55; ctx.beginPath(); ctx.ellipse(0.75,hy-0.25,0.28,0.38,0,0,6.283); ctx.fill(); ctx.globalAlpha=1; }
    else if(view==='front'){ ctx.fillStyle='#2b4660'; ctx.beginPath(); ctx.ellipse(0,hy+0.12,1.0,0.82,0,0,6.283); ctx.fill(); ctx.fillStyle='#c79a4a'; ctx.globalAlpha=0.55; ctx.beginPath(); ctx.ellipse(-0.35,hy-0.15,0.3,0.25,0,0,6.283); ctx.fill(); ctx.globalAlpha=1; }
    ctx.fillStyle = '#fff3c8'; ctx.fillRect(view==='side'?0.1:-0.25, hy-1.4, 0.5, 0.35);

    else if(view==='side'){ ctx.beginPath(); ctx.arc(-0.15,hy-0.15,1.17,Math.PI*0.75,Math.PI*1.9); ctx.fill(); if(a.hairStyle===1){ ctx.beginPath(); ctx.arc(-1.0,hy-0.6,0.5,0,6.283); ctx.fill(); } }
    else { ctx.beginPath(); ctx.arc(0,hy-0.15,1.17,Math.PI*1.02,Math.PI*1.98); ctx.fill(); if(a.hairStyle===2){ ctx.fillRect(-1.15,hy-0.3,0.35,1.1); ctx.fillRect(0.8,hy-0.3,0.35,1.1); } }
    ctx.fillStyle = '#1d1512';
    if(view==='front'){ ctx.fillRect(-0.48,hy+0.05,0.26,0.3); ctx.fillRect(0.22,hy+0.05,0.26,0.3); }
