/* ---------- sparks and dust ---------- */
let particles = [];
function updateParticles(rdt){
  if(!paused) agents.forEach(a=>{
    if(a.state==='work' && a.wait>0){
      a.sAcc = (a.sAcc||0) + rdt*38;
      while(a.sAcc>1){ a.sAcc--; if(particles.length<600){ const f=a.face||1; particles.push({ kind:'spark', x:a.x+f*2.3*(a.tall||1), y:a.y-4.2*(a.tall||1), vx:R(-10,10)+f*R(4,14), vy:R(-20,4), life:0, max:R(0.22,0.6) }); } }
    }
    if(a.state==='mining' && a.wait>0 && a.mine){
      a.dAcc = (a.dAcc||0) + rdt*7;
      while(a.dAcc>1){ a.dAcc--; if(particles.length<600){ const f=a.face||1; particles.push({ kind: a.mine.site.kind==='ice' ? 'frost' : 'dust', x:a.x+f*2.5, y:a.y-0.4, vx:R(-5,5)+f*3, vy:R(-7,-1), life:0, max:R(0.6,1.3), r:R(0.5,1.2) }); } }
    }
  });
  particles.forEach(p=>{ p.life+=rdt; p.px=p.x; p.py=p.y; p.x+=p.vx*rdt; p.y+=p.vy*rdt; if(p.kind==='spark'){ p.vy += 48*rdt; } else { p.vx*=0.96; p.vy*=0.96; p.r+=rdt*1.4; } });
  particles = particles.filter(p=>p.life<p.max);
}
function drawDust(){
  particles.forEach(p=>{ if(p.kind==='spark') return; const k=1-p.life/p.max; ctx.globalAlpha = 0.45*k; ctx.fillStyle = p.kind==='frost' ? '#eaf8ff' : '#c98b5c'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill(); });
  ctx.globalAlpha = 1;
}
function drawSparks(time){
  ctx.lineCap = 'round';
  particles.forEach(p=>{
    if(p.kind!=='spark' || p.px===undefined) return;
    const k = 1-p.life/p.max;
    ctx.globalAlpha = k; ctx.strokeStyle = k>0.5 ? '#ffe9a8' : '#ff9a3c'; ctx.lineWidth = 0.38;
    ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke();
  });
  agents.forEach(a=>{
    if(a.state!=='work' || a.wait<=0) return;
    const f=a.face||1, x=a.x+f*2.3*(a.tall||1), y=a.y-4.2*(a.tall||1), fl = 0.55+0.45*Math.random();
    ctx.globalAlpha = 0.35*fl; ctx.fillStyle = '#9fd4ff'; ctx.beginPath(); ctx.arc(x,y,2.6*fl,0,6.283); ctx.fill();
    ctx.globalAlpha = 0.95*fl; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x,y,0.6,0,6.283); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/* ---------- light pass ---------- */
function drawLights(time, night, cutBase){
  const glow = (x,y,r,col,al) => { ctx.globalAlpha = al; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill(); };
  modules.forEach(m=>{
    if(m.built<1) return;
    const k=KINDS[m.kind], x=m.tx*T, y=m.ty*T, w=m.tw*T, h=m.th*T;
    if(night>0.2){ ctx.globalAlpha = 0.10*night; ctx.fillStyle = '#ffbf73'; ctx.fillRect(x, y+h, w, 3); ctx.globalAlpha = 0.05*night; ctx.fillRect(x-2, y+h+3, w+4, 3); }
    const S = artFor(m);
    if(S){
      const vis = 1 - (selected===m && selected.peek ? 1 : cutBase);
      if(vis<=0.02) return;
      const X=x-3, Y=y-3, Wb=w+6, Hb=h+6;
      ctx.imageSmoothingEnabled = true;
      const pulse = 0.5 + 0.5*Math.sin(time*(m.kind==='core' ? 1.8 : 1.1) + m.id*1.7);
      const aAcc = ((0.08 + 0.22*pulse) + night*(0.3 + 0.45*pulse)) * vis;
      ctx.globalAlpha = aAcc; ctx.drawImage(S.accent, X, Y, Wb, Hb);
      ctx.globalAlpha = aAcc*0.35; ctx.drawImage(S.accent, X-1.5, Y-1.5, Wb+3, Hb+3);
      if(night>0.05){ ctx.globalAlpha = 0.85*night*vis; ctx.drawImage(S.windows, X, Y, Wb, Hb); ctx.globalAlpha = 0.3*night*vis; ctx.drawImage(S.windows, X-1, Y-1, Wb+2, Hb+2); }
      if(m.doorOpen>0.05){ const r=S.rect; glow(X+(r[0]+r[2])/2*Wb, Y+r[3]*Hb, (r[2]-r[0])*Wb*0.6, '#ffe2b0', 0.25*m.doorOpen*(0.4+night)); }
      if(night>0.2){ ctx.globalAlpha = 0.10*night; ctx.fillStyle = '#ffbf73'; ctx.fillRect(x, y+h, w, 3); }
      ctx.imageSmoothingEnabled = false;
      return;
    }
    windowsOf(m).forEach(p=>{
      ctx.globalAlpha = 0.15+0.75*night; ctx.fillStyle = m.kind==='habitat' ? '#ffd59a' : k.color; ctx.fillRect(p.x,p.y,3,2.5);
    });
    if(m.kind==='habitat') for(let xx=x+6; xx<x+w-6; xx+=8){ ctx.globalAlpha = 0.7*night; ctx.fillStyle='#ffd59a'; ctx.fillRect(xx, y+(h-T)/2-1.5, 4, 3); }
    if(m.kind==='core') glow(x+w/2, y+(h-T)/2, Math.min(w,h)*0.12, '#ffb347', 0.2+0.4*night);
    if(m.kind==='garden'){ ctx.globalAlpha = 0.28*night; ctx.fillStyle = '#9dff8a'; ctx.fillRect(x+1,y+1,w-2,h-T-2); }
    if(m.kind==='archive'){ for(let yy=y+4; yy<y+h-T-3; yy+=6) for(let xx=x+4; xx<x+w-4; xx+=6) if(Math.sin(time*2+xx*.7+yy)>0.3){ ctx.globalAlpha = 0.3+0.6*night; ctx.fillStyle = k.color; ctx.fillRect(xx+1,yy+1,1,1); } }
    if(m.kind==='comms' && Math.sin(time*3)>0.3) glow(x+w*0.55, y+(h-T)*0.5-6, 1.6, '#ff4a3a', 0.9);
    if(m.pulse>0.6) glow(x+w/2, y+h/2, Math.max(w,h)*0.6, k.color, 0.25*(m.pulse-0.6));
  });
  corridors.forEach(c=>{
    if(c.built<1) return;
    const r = corridorRect(c,1);
    if(r.horiz){ for(let x=r.x0+6; x<r.x1-3; x+=14){ ctx.globalAlpha = 0.85*night; ctx.fillStyle='#ffcf8a'; ctx.fillRect(x, c.p1.y-0.5, 1, 1); } }
    else { for(let y=r.y0+6; y<r.y1-3; y+=14){ ctx.globalAlpha = 0.85*night; ctx.fillStyle='#ffcf8a'; ctx.fillRect(c.p1.x-0.5, y, 1, 1); } }
  });
  packets.forEach(p=>{
    const c=p.c, t = p.fwd ? p.t : 1-p.t;
    const x = c.p1.x+(c.p2.x-c.p1.x)*t, y = c.p1.y+(c.p2.y-c.p1.y)*t;
    glow(x,y,1.6,p.color,0.12+0.2*night);
    ctx.globalAlpha = 0.5+0.5*night; ctx.fillStyle = p.color; ctx.fillRect(x-0.6,y-0.6,1.2,1.2);
  });
  agents.forEach(a=>{
    if(!isOutside(a)) return;
    if(a.state==='mining' && a.wait<=0 && Math.sin(time*11+a.id*5)>0.85) glow(a.x + a.face*2, a.y+1, 1.4, a.mine.site.kind==='ice' ? '#e8fbff' : '#ffcf9a', 0.9);
    if(night>0.15){ glow(a.x + (a.face||1)*3.2, a.y-0.6, 2.4, '#fff1cf', 0.10*night); glow(a.x + (a.face||1)*0.7, a.y-6.4*(a.tall||1), 0.5, '#fff6dc', 0.9*night); }
    if(a.state==='work' && a.wait<=0 && Math.sin(time*13+a.id*3)>0.82) glow(a.x + a.face*2, a.y, 1.6, '#ffe9a0', 0.9);
  });
  ctx.globalAlpha = 1;
}

/* ---------- input ---------- */
const pts = new Map(); let pinch=null, moved=0;
function local(e){ const r=cv.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
function toWorld(p){ return { x:(p.x-W/2)/cam.z+cam.x, y:(p.y-H/2)/cam.z+cam.y }; }
function pinchDist(){ const v=[...pts.values()]; return Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y); }

cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, local(e)); moved = 0;
  if(pts.size===2) pinch = { d:pinchDist(), z:cam.z };
});
cv.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId), cur = local(e);
  pts.set(e.pointerId, cur);
  if(pts.size===1){
    const dx=cur.x-prev.x, dy=cur.y-prev.y;
    moved += Math.abs(dx)+Math.abs(dy);
    if(moved>6){ cam.x -= dx/cam.z; cam.y -= dy/cam.z; userMoved=true; camTarget=null; }
  } else if(pts.size===2 && pinch){
    cam.z = clamp(pinch.z*pinchDist()/pinch.d, 0.6, 9); moved += 100; userMoved=true; camTarget=null;
  }
});
function endPointer(e){
  if(pts.size===1 && moved<6 && e.type==='pointerup') tap(local(e));
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=null;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const p = local(e), before = toWorld(p);
  cam.z = clamp(cam.z*Math.exp(-e.deltaY*0.0015), 0.6, 9);
  const after = toWorld(p);
  cam.x += before.x-after.x; cam.y += before.y-after.y;
  userMoved=true; camTarget=null;
}, { passive:false });

function tap(p){
  const w = toWorld(p);
  const m = modules.find(m=>w.x>=m.tx*T && w.x<=(m.tx+m.tw)*T && w.y>=m.ty*T && w.y<=(m.ty+m.th)*T);
  if(m && m===selected) m.peek = !m.peek;
  else { if(selected) selected.peek = false; selected = m || null; }
  renderInspector();
}

/* ---------- inspector ---------- */
const iEl = document.getElementById('inspect');
function renderInspector(){
  if(!selected){ iEl.hidden = true; return; }
  const m = selected, k = KINDS[m.kind];
  iEl.hidden = false;
  iEl.style.setProperty('--k', k.color);
  document.getElementById('iName').textContent = m.name;
  let here, incoming;
  if(m.built<1){
    here = agents.filter(a=>a.job===construction && a.state==='work' && construction && construction.m===m);
    incoming = agents.filter(a=>a.state==='eva' && a.after==='work' && a.job && a.job.m===m);
    document.getElementById('iDesc').textContent = `Under construction, ${Math.round(m.built*100)}% done. ${here.length ? here.length+' working on site' : 'No one on site, so the work has stopped'}${incoming.length?`, ${incoming.length} suiting up and heading out`:''}.`;
  } else {
    here = agents.filter(a=>a.mod===m && isInside(a));
    incoming = agents.filter(a=>a.state==='transit' && other(a.cor, a.fromA ? a.cor.a : a.cor.b)===m);
    document.getElementById('iDesc').textContent = `${k.desc} ${here.length} ${here.length===1?'being':'beings'} here now${incoming.length?`, ${incoming.length} on the way`:''}. ${m.peek ? 'Tap again to close the roof.' : 'Tap again to look inside.'}`;
  }
  const list = document.getElementById('iList');
  list.innerHTML = '';
  if(!here.length && !incoming.length){
    const li = document.createElement('li'); li.className='empty';
    li.textContent = 'Empty right now. Someone may wander in, or a little inspiration might draw them.';
    list.appendChild(li); return;
  }
  [...here, ...incoming].forEach(a=>{
    const li = document.createElement('li');
    const hrs = simTime-a.born;
    const age = a.earthBorn ? `Earth-born, ${Math.floor(hrs/YEAR_H)} Mars years` :
                hrs<SOL_H ? 'newborn' : hrs<YEAR_H ? `${Math.floor(hrs/SOL_H)} sols old` : `${Math.floor(hrs/YEAR_H)} Mars years`;
    li.innerHTML = `<b></b> <span></span><em></em>`;
    li.querySelector('b').textContent = a.name;
    li.querySelector('span').textContent = `${describe(a.persona)}, ${age}`;
    li.querySelector('em').textContent = a.state==='transit' ? 'Arriving soon' : isOutside(a) ? a.thought : (a.talk && simTime<a.talk.until) ? `Talking with ${a.talk.with.name}: “${a.talk.line}”` : a.thought;
    li.querySelector('b').style.color = TRAITS[a.trait].color;
    list.appendChild(li);
  });
}
document.getElementById('iClose').addEventListener('click', ()=>{ selected=null; renderInspector(); });

/* ---------- creator tools ---------- */
// You are not a builder here. You can only influence; the beings decide what to do with it.
const POWERS = {
  fortune: { btn:'bFortune', label:'Good fortune', cd:SOL_H*3 },
  inspire: { btn:'bInspire', label:'Inspire',      cd:SOL_H*2 },
  grace:   { btn:'bGrace',   label:'Grace',        cd:SOL_H*2 },
  sign:    { btn:'bSign',    label:'Send a sign',  cd:SOL_H*1 }
};
function use(power, fn){
  if(simTime < cooldown[power]) return;
  if(fn() !== false){ cooldown[power] = simTime + POWERS[power].cd; updateHud(); }
}
document.getElementById('bFortune').addEventListener('click', ()=>use('fortune', ()=>{
  fortuneUntil = simTime + SOL_H;
  modules.filter(m=>m.kind==='core').forEach(m=>m.pulse=1);
  const w = agents.slice().sort((x,y)=>y.persona.care-x.persona.care)[0];
  if(w) w.thought = 'The reactors feel strangely generous today';
  addLog('You granted good fortune. The reactors run hot for a sol', '#ffb347');
}));
document.getElementById('bInspire').addEventListener('click', ()=>use('inspire', ()=>{
  if(!selected){ addLog('Tap a module first. Inspiration spreads from a place', '#8a96c8'); return false; }
  const m = selected, label = KINDS[m.kind].label.toLowerCase();
  inspiration = { kind:m.kind, until:simTime+SOL_H*2, from:m.name };
  const here = agents.filter(a=>a.mod===m && isInside(a));
  here.forEach(a=>{ a.thought = `Dreaming of another ${label}`; });
  m.pulse = 1;
  addLog(here.length ? `You inspired ${m.name}. ${here.length} ${here.length===1?'being dreams':'beings dream'} of another ${label}` :
                       `You inspired ${m.name}. No one is there to dream it yet`, KINDS[m.kind].color);
}));
document.getElementById('bGrace').addEventListener('click', ()=>use('grace', ()=>{
  if(!selected || selected.kind!=='habitat' || selected.built<1){ addLog('Grace only takes hold in a habitat. Tap one first', '#8a96c8'); return false; }
  graceFor.set(selected.id, simTime+SOL_H*1.5);
  selected.pulse = 1;
  addLog(`You blessed ${selected.name}. It feels like a good time to be born`, '#4ff0ff');
}));
document.getElementById('bSign').addEventListener('click', ()=>use('sign', ()=>{
  lastSignAt = simTime;
  meteor = { t0:performance.now(), x:R(.1,.6), y:R(.05,.3), ang:R(.25,.6) };
  let went = 0, stayed = 0;
  agents.filter(a=>isInside(a)).forEach(a=>{
    const pull = a.persona.curiosity + a.persona.restless*.5 - a.persona.steady*.6 + R(-.15,.15);
    const nb = neighbors(a.mod);
    if(pull > .35 && nb.length){
      const look = nb.filter(c=>['comms','archive'].includes(other(c,a.mod).kind));
      const c = look.length ? pick(look) : pick(nb);
      a.cor = c; a.fromA = (c.a===a.mod);
      const q = clampIn(a.mod, a.fromA ? c.p1 : c.p2);
      a.tx=q.x; a.ty=q.y; a.state='toDoor'; a.wait=0;
      a.thought = 'Saw a light cross the sky and went to look'; went++;
    } else {
      a.thought = a.persona.steady>.55 ? 'Saw the light, kept working' : 'Wondering what that light meant'; stayed++;
    }
  });
  addLog(`A light crossed the sky. ${went} went to look, ${stayed} stayed put`, '#ffe066');
}));
const bPause = document.getElementById('bPause');
bPause.addEventListener('click', ()=>{ paused=!paused; bPause.textContent = paused ? 'Resume' : 'Pause'; });
const bSpeed = document.getElementById('bSpeed');
bSpeed.addEventListener('click', ()=>{ speed = speed===1 ? 3 : speed===3 ? 6 : speed===6 ? 12 : 1; bSpeed.textContent = `Speed ${speed}×`; });
document.getElementById('bArt').addEventListener('click', e=>{
  useArt = !useArt;
  e.currentTarget.textContent = `Art: ${useArt ? '2D' : 'code'}`;
});
document.getElementById('bFit').addEventListener('click', ()=>{ userMoved=false; fitView(); });

/* ---------- HUD ---------- */
const sBeings=document.getElementById('sBeings'), sMods=document.getElementById('sMods'),
      sEnergy=document.getElementById('sEnergy'), sBar=document.getElementById('sBar'), cycleEl=document.getElementById('cycle');
let hudTimer = 0;
function updateHud(){
  sBeings.textContent = agents.length;
  sMods.textContent = modules.filter(m=>m.built>=1).length;
  document.getElementById('sIce').textContent = Math.floor(ice);
  document.getElementById('sReg').textContent = Math.floor(regolith);
  const dp = (Math.min(1,agents.length/DOME_GOAL.pop) + Math.min(1,ice/DOME_GOAL.ice) + Math.min(1,regolith/DOME_GOAL.regolith))/3;
  document.getElementById('sDome').style.width = (dp*100).toFixed(0)+'%';
  sEnergy.textContent = Math.round(energy);
  sBar.style.width = Math.min(100, energy/cap()*100).toFixed(0)+'%';
  const net = production()-consumption();
  const yr = Math.floor(simTime/YEAR_H)+1, sol = Math.floor((simTime%YEAR_H)/SOL_H)+1, h = marsHour(simTime);
  const hh = String(Math.floor(h)).padStart(2,'0'), mm = String(Math.floor((h%1)*60)).padStart(2,'0');
  cycleEl.textContent = `${SITE.name}, year ${yr}, sol ${sol}, ${hh}:${mm} ${h>=6&&h<18?'\u2600':'\u263E'}  ${season(simTime)}   ${net>=0?'+':''}${net.toFixed(1)} energy/h${construction?'   building '+construction.m.name:''}`;
  Object.entries(POWERS).forEach(([k,pw])=>{
    const b = document.getElementById(pw.btn), left = cooldown[k]-simTime;
    b.disabled = left>0;
    b.textContent = left>0 ? `${pw.label} (${(left/SOL_H).toFixed(1)} sols)` : pw.label;
  });
  if(selected) renderInspector();
}

/* ---------- seed the world ---------- */
const core = makeModule('core', 0, 0, 12, 10);
function attach(parent, kind, dir, tw, th, gap){
  const cy=Math.floor(parent.ty+parent.th/2), cx=Math.floor(parent.tx+parent.tw/2);
  let tx,ty,gr;
  if(dir==='r'){ tx=parent.tx+parent.tw+gap; ty=cy-Math.floor(th/2); gr={tx:parent.tx+parent.tw,ty:cy-1,tw:gap,th:3}; }
  if(dir==='l'){ tx=parent.tx-gap-tw; ty=cy-Math.floor(th/2); gr={tx:tx+tw,ty:cy-1,tw:gap,th:3}; }
  if(dir==='d'){ ty=parent.ty+parent.th+gap; tx=cx-Math.floor(tw/2); gr={tx:cx-1,ty:parent.ty+parent.th,tw:3,th:gap}; }
  if(dir==='u'){ ty=parent.ty-gap-th; tx=cx-Math.floor(tw/2); gr={tx:cx-1,ty:ty+th,tw:3,th:gap}; }
  const n = makeModule(kind, tx, ty, tw, th, 1);
  makeCorridor(parent, n, { dir, gr, cx, cy }, 1);
  return n;
}
const hab = attach(core, 'habitat', 'r', 13, 9, 7);
const shop = attach(core, 'workshop', 'd', 12, 9, 6);
const founder = (m, role) => makeAgent(m, { founder:true, bornAt: START_HOUR - R(EARTH_YEAR_H*24, EARTH_YEAR_H*45), wantRole: role });
['builder','builder','social','curious'].forEach(r=>founder(hab, r));
['tender','social'].forEach(r=>founder(core, r));
founder(shop, 'builder');
spawnSite('regolith', 15, 60);
spawnSite('ice', 60, 140);
spawnSite('ice', 80, 160);

resize();
buildTerrain();
fitView(true);
addLog(`Seven colonists from Earth landed at ${SITE.name}`, '#4ff0ff');
addLog('Every being born here will carry a Martian sky', '#ffb347');
addLog('Zoom in to see through the roofs, or tap a building to look inside', '#8a96c8');

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if(!paused) for(let i=0;i<speed;i++) step(dt);
  updateDoors(dt);
  updateParticles(dt);
  render(now/1000);
  hudTimer += dt;
  if(hudTimer>0.3){ hudTimer=0; updateHud(); }
  requestAnimationFrame(frame);
}
updateHud();
requestAnimationFrame(frame);
})();
</script>
